services:
  musiklib:
    image: python:3.12-slim
    container_name: musiklib
    working_dir: /app
    command: ["sh", "-c", "pip install --quiet --no-cache-dir -r requirements.txt && exec python3 app.py"]
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: /mnt/user/appdata/musiklib
        target: /app
      - type: bind
        source: /mnt/user/Music
        target: /music
        read_only: true
    environment:
      - MUSIC_DIR=/music
      - DATA_DIR=/app/data
      - PORT=8080
      - TZ=Europe/Berlin
    restart: unless-stopped
    labels:
      - "net.unraid.docker.webui=http://[IP]:[PORT:8080]/"
      - "net.unraid.docker.icon=https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/svg/headphones.svg"
