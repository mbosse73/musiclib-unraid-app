    <button data-zurueck aria-label="30 Sekunden zurück">${I.back(20)}</button>
    <button class="rot" data-pp aria-label="Abspielen">${I.play(20)}</button>
    <button data-vor aria-label="30 Sekunden vor">${I.fwd(20)}</button>
    <button data-next aria-label="Nächster Titel">${I.next(20)}</button>
    ${auswurf ? `<button data-auswurf title="Kassettenfach" aria-label="Bibliothek">${AUSWURF}</button>` : ''}
  </div>`;

function verdrahte(w, deck){
  const q = s => w.querySelector(s);
  q('[data-pp]').onclick   = () => deck.toggle();
  q('[data-next]').onclick = () => deck.next();
  q('[data-prev]').onclick = () => deck.prev();
  q('[data-vor]').onclick      = () => deck.seekGlobal(deck.gpos + 30);
  q('[data-zurueck]').onclick  = () => deck.seekGlobal(deck.gpos - 30);
  bindDrag(q('[data-band]'), f => deck.seekGlobal(f * deck.total));

  const fach = q('[data-fach]');
  if (fach){
    const auf = zu => fach.classList.toggle('auf', zu);
    q('[data-auswurf]').onclick = () => {
      const offen = !fach.classList.contains('auf');
      auf(offen);
      if (offen) setTimeout(() => q('[data-suche]').focus(), 60);
    };
    q('[data-zu]').onclick = () => auf(false);
    offeneBlenden.push(() => auf(false));
  }

  const regal = q('[data-regal]'), feld = q('[data-suche]');
  const markiereRegal = () => $$('.spine', w)
    .forEach(el => el.classList.toggle('an', !!deck.album && el.dataset.alb === deck.album.id));
  function zeichneRegal(){
    const treffer = suche(feld.value);
    regal.innerHTML = treffer.map(a => `
      <div class="spine" data-alb="${esc(a.id)}">
        <span class="farbe" style="background:${grad(a)}"></span>
        <div class="m"><div class="t">${esc(a.t)}</div>
          <div class="s">${esc(a.ar)} · ${fmtLang(albDur(a))}</div></div></div>`).join('') ||
      '<div class="spine" style="box-shadow:none"><div class="m"><div class="s">Nichts gefunden.</div></div></div>';
    q('[data-treffer]').textContent = feld.value.trim()
      ? `${treffer.length} von ${ALBUMS.length} Kassetten` : `${ALBUMS.length} Kassetten`;
    $$('.spine', w).forEach(el => el.dataset.alb && (el.onclick = () => {
      const a = ALBUMS.find(x => x.id === el.dataset.alb);
      if (a) deck.ladeAlbum(a, 0);
      if (fach) fach.classList.remove('auf');       // eingelegt heisst: Fach zu
    }));
    markiereRegal();
  }
  feld.oninput = zeichneRegal;
  zeichneRegal();

  /* Wickelradius ueber die Flaeche, nicht ueber den Radius: Bandlaenge waechst
     mit der Flaeche, also geht der Radius mit der Wurzel. Linear sieht am
     Anfang zu schnell und am Ende zu langsam aus. */
  const kass = q('[data-kass]');
  const radius = (f, kw) => {
    const rNabe = kw * .062, rVoll = kw * .155;
    return Math.sqrt(rNabe*rNabe + (rVoll*rVoll - rNabe*rNabe) * clamp(f,0,1));
  };

  let letztesAlbum = null;
  deck.onRender = d => {
    const a = d.album;
    if (!d.track) return;
    if (letztesAlbum !== (a && a.id)){
      letztesAlbum = a && a.id;
      q('[data-etalb]').textContent = a ? a.t : '';
      q('[data-ar]').textContent = a ? `${a.ar} · ${a.tr.length} Titel` : '';
      markiereRegal();
    }
    const kw = kass.offsetWidth || 620;
    const f  = d.total ? d.gpos / d.total : 0;
    const linksX = 22, rechtsX = 78;                          // in Prozent des Fensters
    const rl = radius(f, kw), rr = radius(1 - f, kw);
    const setz = (el, x, r) => {
      el.style.left = x + '%'; el.style.width = (r*2) + 'px'; el.style.height = (r*2) + 'px'; };
    setz(q('[data-wl]'), linksX,  rl);
    setz(q('[data-wr]'), rechtsX, rr);
    q('[data-nl]').style.left = linksX + '%';
    q('[data-nr]').style.left = rechtsX + '%';
    q('[data-bandl]').style.left  = linksX + '%';
    q('[data-bandl]').style.width = (rechtsX - linksX) + '%';
    q('[data-nl]').classList.toggle('halt', !d.playing);
    q('[data-nr]').classList.toggle('halt', !d.playing);
    q('[data-voll]').style.width = (f*100).toFixed(2) + '%';
    q('[data-griff]').style.left = (f*100).toFixed(2) + '%';
    q('[data-zaehler]').textContent = String(Math.floor(d.gpos/6)).padStart(4,'0');
    q('[data-rest]').textContent = d.fehler || 'Rest ' + fmtLang(d.total - d.gpos);
    q('[data-lauf]').textContent = `${String(d.qi+1).padStart(2,'0')} · ${fmt(d.pos)} / ${fmt(d.dur)}`;
    q('[data-pp]').innerHTML = d.playing ? I.pause(20) : I.play(20);
    q('[data-pp]').classList.toggle('gedrueckt', d.playing);
  };
}

function verdrahte(w, deck, anzahl){
  const q = s => w.querySelector(s);
  q('[data-pp]').onclick = () => deck.toggle();
  $$('[data-next]', w).forEach(b => b.onclick = () => deck.next());
  $$('[data-prev]', w).forEach(b => b.onclick = () => deck.prev());
  bindDrag(q('[data-vol]'), f => deck.setVol(f));

  /* Die drei „Quellen" des Entwurfs waren Zierrat; hier sind es zwei, die
     etwas tun: die Reihenfolge der Warteschlange. */
  const folgen = $$('.quelle', w);
  const zeigeFolge = () => folgen.forEach(el =>
    el.classList.toggle('an', (el.dataset.folge === 'zufall') === !!deck.shuffle));
  folgen.forEach(el => el.onclick = () => {
    if ((el.dataset.folge === 'zufall') !== !!deck.shuffle) deck.toggleShuffle();
    zeigeFolge();
  });

  /* Rad: Winkeldifferenz zwischen zwei Zeigerpunkten, 60 s je Umdrehung */
  const rad = q('[data-rad]');
  let letzterWinkel = null;
  const winkel = ev => {
    const r = rad.getBoundingClientRect();
    return Math.atan2(ev.clientY - (r.top + r.height/2), ev.clientX - (r.left + r.width/2)) * 180/Math.PI;
  };
  rad.addEventListener('pointerdown', ev => {
    letzterWinkel = winkel(ev); try{ rad.setPointerCapture(ev.pointerId); }catch{} ev.preventDefault(); });
  rad.addEventListener('pointermove', ev => {
    if (letzterWinkel === null) return;
    const wk = winkel(ev);
    let d = wk - letzterWinkel;
    if (d > 180) d -= 360; if (d < -180) d += 360;   // Sprung bei 360° abfangen
    letzterWinkel = wk;
    deck.seekGlobal(deck.gpos + d/360 * 60);
  });
  const los = () => letzterWinkel = null;
  rad.addEventListener('pointerup', los);
  rad.addEventListener('pointercancel', los);

  const bib = bindBibliothek({
    knopf: q('[data-bib]'), zu: q('[data-bib-zu]'), blende: q('[data-bib-blende]'),
    feld: q('[data-suche]'), liste: q('[data-bibliothek]'), treffer: q('[data-btreffer]'), deck,

    leer: '<div class="bz" style="box-shadow:none;background:none"><span class="s">Nichts gefunden.</span></div>',
  });

  /* Die Leuchtflaechen zeigen das laufende Album und seine Nachbarn im
     Regal — keine Kacheln, sondern das, was gerade daneben steht. */
  function zeigeReihe(d){
    const start = Math.max(0, ALBUMS.findIndex(a => d.album && a.id === d.album.id));
    const um = Array.from({length:Math.min(anzahl, ALBUMS.length)},
      (_,k) => ALBUMS[(start + k) % ALBUMS.length]);
    q('[data-reihe]').innerHTML = um.map((a,k) => `
      <div class="schirmchen${k===0?' an':''}" data-alb="${esc(a.id)}">
        ${coverHTML(a, 'bild')}
        <div class="glas"></div>
        <div class="unter"><div style="min-width:0">
          <div class="t">${esc(a.t)}</div><div class="s">${[esc(a.ar), esc(a.y)].filter(Boolean).join(' · ')}</div></div>
          <span class="laeuft">▶ läuft</span></div>
      </div>`).join('');
    $$('.schirmchen', w).forEach(el => el.onclick = () => {
      const a = ALBUMS.find(x => x.id === el.dataset.alb);
      if (a) deck.ladeAlbum(a, 0);
    });
  }

  let letztesAlbum = null, letzter = null;
  deck.onRender = d => {
    const t = d.track, a = d.album;
    if (!t) return;
    if (letztesAlbum !== (a && a.id)){ letztesAlbum = a && a.id; zeigeReihe(d); bib.markiere(); }
    if (letzter !== t.id){
      letzter = t.id;
      q('[data-titel]').textContent = t.t;
      q('[data-unter]').textContent = a
        ? `${a.ar} — ${a.t} · Titel ${d.qi+1}/${d.queue.length}` : '';
    }
    if (d.fehler) q('[data-unter]').textContent = d.fehler;
    q('[data-jetzt]').textContent = fmt(d.pos);
    q('[data-ende]').textContent  = '−' + fmt(d.rest);
    q('[data-balken]').style.width = (d.frac*100).toFixed(2) + '%';
    q('[data-pp]').innerHTML = d.playing ? I.pause(20) : I.play(20);
    q('[data-volgriff]').style.left = (8 + d.vol*84) + '%';
    q('[data-kerbe]').style.transform = `rotate(${(d.gpos/60*360 % 360).toFixed(1)}deg)`;
    zeigeFolge();
  };
}

      </div>
      <div class="bib" data-bib-blende>
        <div class="bkopf">
          <h2>Bibliothek</h2>
          <label class="suchfeld">${I.search(19)}
            <input type="search" placeholder="Album, Interpret oder Titel suchen …" data-suche>
          </label>
          <button class="schalter" data-bib-zu style="--sd:56px" aria-label="Schließen"><i></i></button>
        </div>
        <div class="bliste" data-bibliothek></div>
        <div class="bfuss" data-btreffer></div>
      </div>`;

    const q = s => w.querySelector(s);
    q('[data-pp]').onclick   = () => deck.toggle();
    q('[data-next]').onclick = () => deck.next();
    q('[data-prev]').onclick = () => deck.prev();
    bindDrag(q('[data-band]'), f => deck.seek(f));
    bindDrag(q('[data-vol]'), f => deck.setVol(1-f), {achse:'y'});   // oben ist laut

    const bib = bindBibliothek({
      knopf: q('[data-bib]'), zu: q('[data-bib-zu]'), blende: q('[data-bib-blende]'),
      feld: q('[data-suche]'), liste: q('[data-bibliothek]'), treffer: q('[data-btreffer]'), deck,
      zeile: a => `<div class="bz" data-alb="${esc(a.id)}">
          <span class="pl"><i>${esc(ini(a))}</i></span>
          <span class="m"><span class="t">${esc(a.t)}</span>
            <span class="s">${[esc(a.ar), esc(a.y)].filter(Boolean).join(' · ')}</span></span>
          <span class="n">${a.tr.length} · ${fmtLang(albDur(a))}</span>
        </div>`,
      leer: '<div class="bz" style="border:none;cursor:default"><span class="s">Nichts gefunden.</span></div>',
    });

    const fenster = q('[data-fenster]');
    let letzteQ = null, letzter = null;
    deck.onRender = d => {
      const t = d.track, a = d.album;
      if (!t) return;
      if (letzteQ !== d.queue.join()){
        letzteQ = d.queue.join();
        fenster.innerHTML = d.queue.map((id,i) =>
          `<div class="z" data-q="${i}"><b>${String(i+1).padStart(2,'0')}</b>
             <span>${esc(TRACKS[id].t)}</span>
             <span class="d">${fmt(TRACKS[id].d)}</span></div>`).join('');
        [...fenster.children].forEach(el => el.onclick = () => d.jump(+el.dataset.q));
        q('[data-lab]').textContent  = a ? a.t : '';
        q('[data-lab2]').textContent = a ? [a.ar, a.y].filter(Boolean).join(' · ') : '';
        bib.markiere();
      }
      [...fenster.children].forEach((el,i) => el.classList.toggle('an', i === d.qi));
      if (letzter !== t.id){
        letzter = t.id;
        q('[data-titel]').textContent = t.t;
        q('[data-ar]').textContent = a ? `${a.ar} — ${a.t}` : '';
      }
      if (d.fehler) q('[data-ar]').textContent = d.fehler;
      const f = d.frac;
      q('[data-voll]').style.width = (f*100).toFixed(2) + '%';
      q('[data-griff]').style.left = (f*100).toFixed(2) + '%';
      q('[data-jetzt]').textContent = fmt(d.pos);
      q('[data-ende]').textContent  = fmt(d.dur);
      q('[data-pp]').innerHTML = d.playing ? I.pause(20) : I.play(20);
      q('[data-teller]').classList.toggle('halt', !d.playing);
      q('[data-arm]').style.transform = `rotate(${(28 + 16*f).toFixed(1)}deg)`;
      q('[data-volgriff]').style.top = ((1-d.vol)*100).toFixed(1) + '%';
    };
  },
});

/* ── 11/12 · Turm und Vollverstärker ──────────────────────────────────── */
(() => {
/* Auswurf — dasselbe Zeichen wie am Kassettendeck, dieselbe Taste wie die
   drei daneben: sie oeffnet die Bibliothek in der Frontplatte. */
const AUSWURF = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
  <path d="M12 5.4l7.4 9.2H4.6z"/><rect x="4.6" y="16.4" width="14.8" height="2.6" rx="1.1"/></svg>`;

const bibHTML = `
  <div class="bib" data-bib-blende>
    <div class="bkopf">
      <h2>Bibliothek</h2>
      <label class="suchfeld">${I.search(17)}
        <input type="search" placeholder="Album, Interpret oder Titel suchen …" data-suche></label>
      <button class="zu" data-bib-zu aria-label="Schließen" style="width:44px;height:44px;
        border-radius:3px;background:linear-gradient(180deg,#EDE7D6,#C8C0A8);
        box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 2px 4px rgba(0,0,0,.3);

    </div>
    <div class="bliste" data-bibliothek></div>

  </div>`;

/* Zeigerinstrument: Skala als Bogen, Zeiger als Linie */
const instrumentHTML = kanal => `
  <div class="instrument">
    <span class="kanal">${kanal}</span>
    <svg viewBox="0 0 200 100">
      <path d="M 24 88 A 88 88 0 0 1 176 88" fill="none" stroke="rgba(42,36,26,.45)" stroke-width="1.2"/>
      <path d="M 130 33 A 88 88 0 0 1 176 88" fill="none" stroke="#7A1E12" stroke-width="2.4"/>
      ${Array.from({length:11}, (_,i) => {
        const wk = Math.PI * (1 - i/10);
        const x1 = 100 + Math.cos(wk)*80,  y1 = 88 - Math.sin(wk)*80;
        const x2 = 100 + Math.cos(wk)*88,  y2 = 88 - Math.sin(wk)*88;
        return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"
          stroke="rgba(42,36,26,.5)" stroke-width="${i%5===0?1.6:.9}"/>`;
      }).join('')}
      <text x="34" y="80" font-size="8" fill="rgba(42,36,26,.6)">−20</text>
      <text x="96" y="18" font-size="8" fill="rgba(42,36,26,.6)">0</text>
      <text x="160" y="80" font-size="8" fill="rgba(42,36,26,.6)">+3</text>
      <line class="nadel" x1="100" y1="88" x2="100" y2="14" stroke="#7A1E12" stroke-width="1.6"
        stroke-linecap="round"/>
      <circle cx="100" cy="88" r="5" fill="#2A241A"/>
    </svg>
    <span class="skalatext">VU · dB</span>
  </div>`;

const messwerkHTML = `
  <div class="messwerk">
    ${instrumentHTML('L')}<span class="zwischen"></span>${instrumentHTML('R')}
  </div>
  <div class="display">
    <div style="min-width:0">
      <div class="titel" data-titel></div>
      <div class="unter" data-unter></div>
    </div>
    <div class="uhr"><span data-jetzt></span> / <span data-ende></span></div>
  </div>`;

const platteHTML = `
  <div class="platte">
    <div class="knopffeld">
      <div class="drehknopf" data-vol><i data-volz></i></div>
      <span class="kap">Lautstärke</span>
    </div>
    <div class="knopffeld">
      <div class="kippschalter" data-shuffle><i></i></div><span class="kap">Zufall</span>
    </div>
    <div class="knopffeld">
      <div class="kippschalter" data-repeat><i></i></div><span class="kap">Wiederholen</span>
    </div>
    <div style="flex:1;min-width:0">
      <span class="kap">Titelwahl</span>
      <div class="waehler" data-waehler style="margin-top:8px"></div>
    </div>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:12px">
      <div class="band" data-band>
        <span class="schiene"></span><span class="voll" data-voll></span><span class="griff" data-griff></span>
      </div>
      <div class="tasten">
        <button data-prev aria-label="Zurück">${I.prev(18)}</button>
        <button data-pp aria-label="Abspielen">${I.pause(18)}</button>
        <button data-next aria-label="Weiter">${I.next(18)}</button>
        <button data-bib title="Bibliothek" aria-label="Bibliothek">${AUSWURF}</button>
      </div>
    </div>
  </div>`;

function verdrahte(w, deck){
  const q = s => w.querySelector(s);
  q('[data-pp]').onclick   = () => deck.toggle();
  q('[data-next]').onclick = () => deck.next();
  q('[data-prev]').onclick = () => deck.prev();
  q('[data-shuffle]').onclick = () => deck.toggleShuffle();
  q('[data-repeat]').onclick  = () => deck.toggleRepeat();
  bindDrag(q('[data-band]'), f => deck.seek(f));
  bindDrag(q('[data-vol]'), f => deck.setVol(1-f), {achse:'y'});

  /* Zeiger: gedaempfter Zufallsgang, faellt bei Pause zurueck. Ein echter
     Pegel kaeme aus einem AnalyserNode — der haengt das Element aber in den
     Audiographen, und ein noch nicht freigegebener AudioContext macht es
     dann stumm. Das ist der Anzeige den Preis nicht wert. */
  const nadeln = $$('.nadel', w);
  const stand = nadeln.map(() => 0);
  const ziel = nadeln.map(() => 0);
  const uhr = setInterval(() => {
    if (!w.isConnected){ clearInterval(uhr); return; }
    nadeln.forEach((n,i) => {
      if (deck.playing){
        if (Math.random() < .4) ziel[i] = .32 + Math.random() * .58 * deck.vol + .1;
      } else ziel[i] = 0;
      stand[i] += (ziel[i] - stand[i]) * .25;                 // Traegheit
      const wk = -52 + clamp(stand[i],0,1) * 104;             // −52° … +52°
      n.setAttribute('transform', `rotate(${wk.toFixed(1)} 100 88)`);
    });
  }, 90);

  const bib = bindBibliothek({
    knopf: q('[data-bib]'), zu: q('[data-bib-zu]'), blende: q('[data-bib-blende]'),
    feld: q('[data-suche]'), liste: q('[data-bibliothek]'), treffer: q('[data-btreffer]'), deck,
    zeile: a => `<div class="bz" data-alb="${esc(a.id)}">
        <span class="pl" style="background:${grad(a)}"></span>
        <span class="m"><span class="t">${esc(a.t)}</span>
          <span class="s">${[esc(a.ar), esc(a.y)].filter(Boolean).join(' · ')}</span></span>
        <span class="n">${a.tr.length} · ${fmtLang(albDur(a))}</span></div>`,
    leer: '<div class="bz" style="border:none;cursor:default"><span class="s">Nichts gefunden.</span></div>',
  });

  /* Vier Titel zur Wahl — als Fenster um den laufenden herum, nicht die
     ersten vier: sonst waere ab Titel fuenf nichts mehr zu waehlen. */
  const waehler = q('[data-waehler]');
  let letztesFenster = null, letzter = null;
  deck.onRender = d => {
    const t = d.track, a = d.album;
    if (!t) return;
    const start = clamp(d.qi - 1, 0, Math.max(0, d.queue.length - 4));
    const kennung = d.queue.slice(start, start+4).join();
    if (letztesFenster !== kennung){
      letztesFenster = kennung;
      waehler.innerHTML = d.queue.slice(start, start+4).map((id,k) =>
        `<div class="wz" data-q="${start+k}"><i></i>${String(start+k+1).padStart(2,'0')} · ${esc(TRACKS[id].t)}</div>`).join('');
      [...waehler.children].forEach(el => el.onclick = () => d.jump(+el.dataset.q));
    }
    [...waehler.children].forEach(el => el.classList.toggle('an', +el.dataset.q === d.qi));
    if (letzter !== t.id){
      letzter = t.id;
      q('[data-titel]').textContent = t.t;
      q('[data-unter]').textContent = a ? [a.ar + ' — ' + a.t, a.y].filter(Boolean).join(' · ') : '';
      bib.markiere();
    }
    if (d.fehler) q('[data-unter]').textContent = d.fehler;
    q('[data-voll]').style.width  = (d.frac*100).toFixed(2) + '%';
    q('[data-griff]').style.left  = (d.frac*100).toFixed(2) + '%';
    q('[data-jetzt]').textContent = fmt(d.pos);
    q('[data-ende]').textContent  = fmt(d.dur);
    q('[data-pp]').innerHTML = d.playing ? I.pause(18) : I.play(18);
    q('[data-volz]').style.transform = `rotate(${(-140 + d.vol*280).toFixed(1)}deg)`;
    q('[data-shuffle]').classList.toggle('an', !!d.shuffle);
    q('[data-repeat]').classList.toggle('an', !!d.repeat);
  };
}

/* ══ Buehne, Wechsler, Tastatur ════════════════════════════════════════════ */
const buehne = document.getElementById('buehne');
const wechsler = document.getElementById('wechsler');
const wahl = document.getElementById('wahl');
let aktuell = null;

function zeigeLayout(id){
  const L = LAYOUTS.find(x => x.id === id) || LAYOUTS[0];
  aktuell = L;
  offeneBlenden = [];
  deck.onRender = () => {};
  buehne.innerHTML = '';
  const w = document.createElement('div');
  w.className = L.klasse;
  buehne.appendChild(w);
  document.documentElement.dataset.layout = L.id;
  wechsler.style.setProperty('--chrome-ink', L.chrome[0]);
  wechsler.style.setProperty('--chrome-grund', L.chrome[1]);
  const meta = document.querySelector('meta[name=theme-color]');
  if (meta && L.chrome[2]) meta.setAttribute('content', L.chrome[2]);
  L.bau(w, deck);
  deck.render();
  store('layout', L.id);
  zeichneWahl();
}

function zeichneWahl(){
  document.getElementById('wahlgitter').innerHTML = LAYOUTS.map(L => `
    <button class="wk${aktuell && L.id === aktuell.id ? ' an' : ''}" type="button" data-l="${L.id}">
      <span class="n">${esc(L.name)}</span>
      <span class="g">${esc(L.geraet)}</span>
      <span class="b">${esc(L.text)}</span>
    </button>`).join('');
  $$('#wahlgitter [data-l]').forEach(el => el.onclick = () => {
    zeigeWahl(false);
    zeigeLayout(el.dataset.l);
  });
}
function zeigeWahl(auf){
  wahl.hidden = !auf;
  wechsler.classList.toggle('wach', auf);
  if (auf) zeichneWahl();
}
wechsler.innerHTML = I.grid(17);
wechsler.onclick = () => zeigeWahl(wahl.hidden);
document.getElementById('wahlzu').onclick = () => zeigeWahl(false);
wahl.addEventListener('click', ev => { if (ev.target === wahl) zeigeWahl(false); });

/* Der Wechsler zeigt sich, wenn sich etwas bewegt, und verblasst wieder. */
let wachBis = 0;
function weckeWechsler(){
  wechsler.classList.add('wach');
  wachBis = Date.now() + 4000;
  setTimeout(() => { if (Date.now() >= wachBis && wahl.hidden) wechsler.classList.remove('wach'); }, 4100);
}
addEventListener('pointermove', weckeWechsler, {passive:true});
addEventListener('pointerdown', weckeWechsler, {passive:true});

addEventListener('keydown', ev => {
  const imFeld = ev.target && /^(INPUT|TEXTAREA)$/.test(ev.target.tagName);
  if (ev.key === 'Escape'){
    if (!wahl.hidden){ zeigeWahl(false); return; }
    offeneBlenden.forEach(fn => fn());
    return;
  }
  if (imFeld || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  switch (ev.key){
    case ' ': ev.preventDefault(); deck.toggle(); break;
    case 'ArrowRight': deck.setzePos(deck.pos + 5); break;
    case 'ArrowLeft':  deck.setzePos(deck.pos - 5); break;
    case 'ArrowUp':    ev.preventDefault(); deck.setVol(deck.vol + .05); break;
    case 'ArrowDown':  ev.preventDefault(); deck.setVol(deck.vol - .05); break;
    case 'n': deck.next(); break;
    case 'p': deck.prev(); break;
    case 'l': case 'L': zeigeWahl(wahl.hidden); break;
  }
});

/* ══ Start ═════════════════════════════════════════════════════════════════ */
function hinweis(titel, text){
  const h = document.getElementById('hinweis');
  if (titel === false){ h.hidden = true; return; }
  h.hidden = false;
  document.getElementById('hinweis-titel').textContent = titel;
  document.getElementById('hinweis-text').innerHTML = text || '';
}

/* Welches Layout beim ersten Mal? Nach der Form des Fensters: hoch ist ein
   iPad in der Hand, breit ein Schreibtisch. Danach entscheidet die Wahl. */
function ersteWahl(){
  const w = innerWidth, h = innerHeight;
  if (h > w) return 'geraet';
  return w >= 1200 ? 'werkstisch' : 'aufgeschlagen';
}

async function start(){
  let daten = null;
  try{
    const r = await fetch('/api/library', {cache:'no-store'});
    if (!r.ok) throw new Error(r.status);
    daten = await r.json();
  }catch(e){
    hinweis('Sammlung nicht erreichbar',
      'Der Server hat nicht geantwortet. Neu laden, oder am <a href="/">Schreibtisch</a> nachsehen.');
    return;
  }
  uebernimm(daten);
  if (!ALBUMS.length){
    hinweis('Noch keine Alben',
      'Diese Seite spielt nur ab. Gescannt wird am <a href="/">Schreibtisch</a>.');
    return;
  }
  hinweis(false);
  const gespeichert = restore('layout', null);
  zeigeLayout(LAYOUTS.some(L => L.id === gespeichert) ? gespeichert : ersteWahl());
  if (!sitzungHolen()){
    deck.queue = ALBUMS[0].ids.slice();
    deck.qi = 0;
    deck.render();
  }
}
start();
