<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:2340px;overflow:hidden}
.stage{position:relative;width:1080px;height:2340px;overflow:hidden}

.stage{background:linear-gradient(180deg, #f0913c 0%, #d9662c 26%, #7a3418 48%, #23150e 62%, #0b0906 100%);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#ffffff}

/* Der Horizont: eine dunkle Kante mit weichem Ansatz, kein Foto */
.horizont{position:absolute;left:0;right:0;background:#0d0906}
.huegel{position:absolute;border-radius:50%;background:#140d08}

/* Die Scheibe: Dicke steckt in blur und Eigenfarbe, die Oberflaeche in den
   beiden Pseudo-Lagen darueber. Alles andere bleibt ueber alle Fassungen gleich. */
.glas{position:relative;background:rgba(255,255,255,0.15);
  border:1px solid rgba(255,255,255,0.3);
  border-top-color:rgba(255,255,255,0.48);
  backdrop-filter:blur(20px) saturate(1.1);
  -webkit-backdrop-filter:blur(20px) saturate(1.1);
  box-shadow:0 26px 60px rgba(0,0,0,.38),
    inset 0 1px 0 rgba(255,255,255,0.48)}
.glas::before{content:"";position:absolute;inset:0;border-radius:inherit;
  pointer-events:none;backdrop-filter:blur(11px);
  -webkit-backdrop-filter:blur(11px);
  background:repeating-linear-gradient(90deg,
    rgba(255,255,255,.16) 0 2.6px, rgba(255,255,255,0) 2.6px 12.0px,
    rgba(0,0,0,.13) 12.0px 14.6px, rgba(255,255,255,0) 14.6px 26.0px)}
.glas > *{position:relative;z-index:1}

.linie{position:relative;border-radius:999px;background:#ffffff59}
.linie i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:#ffffff}
.linie b{position:absolute;top:50%;transform:translate(-50%,-50%);border-radius:50%;
  background:#ffffff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.zeiten{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;
  font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace}
.tasten{display:flex;align-items:center;justify-content:space-between}
.bib{display:inline-flex;align-items:center;border-radius:999px;
  background:rgba(255,255,255,0.19);border:1px solid rgba(255,255,255,0.3);
  backdrop-filter:blur(14px);text-transform:uppercase}
.marke{letter-spacing:4.0px;text-transform:uppercase;color:rgba(255,255,255,.68)}

</style></head><body><div class="stage"><div class="horizont" style="top:1520px;bottom:0"></div>
<div class="huegel" style="left:-260px;top:1360px;width:1000px;height:420px"></div>
<div class="huegel" style="right:-200px;top:1430px;width:820px;height:360px"></div>
<div style="position:absolute;inset:0;padding:150px 62px 130px;display:flex;
  flex-direction:column;align-items:center">
  <span class="bib" style="height:68px;padding:0 26px;gap:14px;font-size:21px;letter-spacing:3.4px"><svg width="27" height="27" viewBox="0 0 24 24"><rect x="3" y="4" width="3" height="16" rx="1" fill="#ffffff"/><rect x="8" y="4" width="3" height="16" rx="1" fill="#ffffff"/><path d="M14.5 5.4 L18.2 4.5 L21.5 19 L17.8 19.9 Z" fill="#ffffff"/></svg>Sammlung · 240</span>
  <div style="margin-top:auto;margin-bottom:auto;width:100%;display:flex;justify-content:center">
    <div class="glas" style="width:956px;border-radius:52px;
  padding:38px 40px 34px">
  <div style="display:flex;align-items:center;gap:30px">
    <div style="line-height:0;flex-shrink:0"><svg viewBox="0 0 220 220" width="220" height="220">
<defs><linearGradient id="hg220f6a" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#f6a24a"/><stop offset="52%" stop-color="#dd6a2c"/>
<stop offset="100%" stop-color="#8a3a1a"/></linearGradient></defs>
<rect x="0" y="0" width="220" height="220" rx="48.4" fill="url(#hg220f6a)"/>
<circle cx="110.0" cy="136.4" r="18.7" fill="#ffe6b0"/>
<path d="M0 154.0 Q 66.0 127.6 121.0 149.6
  T 220 138.6 L220 220 L0 220 Z" fill="#1b120c"/>
</svg></div>
    <div style="flex:1;min-width:0">
      <div style="font-size:54px;font-weight:700;overflow:hidden;
        white-space:nowrap;text-overflow:ellipsis">Blue in Green</div>
      <div style="font-size:33px;color:rgba(255,255,255,.68);
        margin-top:8px;overflow:hidden;white-space:nowrap;
        text-overflow:ellipsis">Miles Davis</div>
    </div>
  </div>
  <div class="zeiten" style="font-size:26px;margin-top:40px">
    <span>02:14</span><span>-03:23</span></div>
  <div class="linie" style="height:7px;margin-top:16px">
    <i style="width:40%"></i>
    <b style="left:40%;width:22px;height:22px"></b></div>
  <div style="margin-top:36px"><div class="tasten" style="gap:10px"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#f2d64b" stroke-width="2.6" stroke-linecap="round"><path d="M3 6h4l4 12h6M3 18h4l2-6"/><path d="M17 3l4 3-4 3M17 15l4 3-4 3"/></svg><svg width="46" height="46" viewBox="0 0 24 24"><path d="M7 5v14M20 5v14l-11-7z" stroke="#ffffff" stroke-width="2" fill="#ffffff" stroke-linejoin="round"/></svg><svg width="48" height="48" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" fill="#ffffff"/><rect x="14" y="5" width="4" height="14" fill="#ffffff"/></svg><svg width="46" height="46" viewBox="0 0 24 24"><path d="M17 5v14M4 5v14l11-7z" stroke="#ffffff" stroke-width="2" fill="#ffffff" stroke-linejoin="round"/></svg><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"><path d="M4 9a5 5 0 0 1 5-5h9"/><path d="M15 1l3 3-3 3"/><path d="M20 15a5 5 0 0 1-5 5H6"/><path d="M9 23l-3-3 3-3"/></svg></div></div>
</div>
  </div>
  <div class="marke" style="font-size:20px">Gegossen und gerippt — der Hintergrund bricht in senkrechte Streifen</div>
</div></div></body></html>
