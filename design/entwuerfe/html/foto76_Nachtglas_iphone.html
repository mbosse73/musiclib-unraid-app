<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:2340px;overflow:hidden}
.stage{position:relative;width:1080px;height:2340px;overflow:hidden}

.stage{background:
    radial-gradient(120% 90% at 50% 8%,#0E131A 0%,#080A0D 62%),
    #080A0D;
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#F2F5F8;-webkit-font-smoothing:antialiased}
/* Der Schein steht hinter dem Glas, nicht darauf — deshalb ein eigenes
   Element unter der Karte und kein Schatten an ihr. */
.schein{position:absolute;border-radius:50%;filter:blur(82px);
  background:radial-gradient(closest-side,#2E5D86 0%,rgba(46,93,134,0) 100%);
  opacity:.62}
.glas{position:relative;border-radius:51px;
  background:linear-gradient(152deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.035) 100%);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 31px 133px rgba(0,0,0,.55)}
.kap{font-size:19px;letter-spacing:.26em;text-transform:uppercase;
  color:rgba(242,245,248,.34);font-weight:600}
.titel{font-size:64px;font-weight:300;letter-spacing:-.02em;line-height:1.05}
.wer{font-size:42px;font-weight:300;color:rgba(242,245,248,.62);margin-top:12px}
.zeit{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;font-size:24px;color:rgba(242,245,248,.34);
  font-variant-numeric:tabular-nums}
/* Jede Zeile eine eigene Scheibe — K25. Die laufende ist die einzige, die
   von hinten Licht bekommt. */
.zeile{display:flex;align-items:center;gap:31px;border-radius:19px;
  padding:0 31px;background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.06);position:relative;overflow:hidden}
.zeile .nr{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;font-size:19px;color:rgba(242,245,248,.34);flex:none;
  font-variant-numeric:tabular-nums}
.zeile .na{font-size:30px;font-weight:300;color:rgba(242,245,248,.62);flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zeile .da{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;font-size:24px;color:rgba(242,245,248,.34);flex:none;
  font-variant-numeric:tabular-nums}
.zeile.gelaufen .na{color:rgba(242,245,248,.34)}
.zeile.jetzt{background:rgba(255,255,255,.10);border-color:rgba(156,199,234,.30)}
.zeile.jetzt .na{color:#F2F5F8;font-weight:400}
.zeile.jetzt .nr,.zeile.jetzt .da{color:#9CC7EA}
.zeile.jetzt::before{content:'';position:absolute;left:0;top:0;bottom:0;
  width:6px;background:#9CC7EA;box-shadow:0 0 31px #5E8FB8}

</style></head><body><div class="stage"><div class="schein" style="left:-71px;top:149px;
