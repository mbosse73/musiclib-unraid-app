<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:1000px;overflow:hidden}
.stage{position:relative;width:1600px;height:1000px;overflow:hidden}

/* Die Front ist eine schwarze Spiegelscheibe: ein stehender Verlauf, ein
   schräger Lichtstreifen darüber. Mehr Material hat das Gerät nicht. */
.stage{background:
    linear-gradient(118deg,rgba(255,255,255,.055) 0%,rgba(255,255,255,0) 26%,
      rgba(255,255,255,.03) 52%,rgba(255,255,255,0) 74%),
    linear-gradient(180deg,#101214 0%,#08090A 46%,#05060700 100%),
    #08090A;
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#F1F3F4;-webkit-font-smoothing:antialiased}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),
    inset 0 -1px 0 rgba(255,255,255,.04)}

/* Das Anzeigefeld selbst — es leuchtet nicht heller als das Glas, es steht
   nur nicht im Spiegel. Deshalb kein Rahmen, nur eine Spur weniger Reflex. */
.feld{position:relative;display:flex;flex-direction:column;
  justify-content:space-between;flex:none;
  background:radial-gradient(120% 160% at 50% 50%,#0C0E10 0%,#08090A 70%)}

.kap{letter-spacing:.24em;text-transform:uppercase;color:rgba(241,243,244,.56);
  font-weight:500}
.titel{font-weight:300;letter-spacing:-.02em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.unterzeile{color:rgba(241,243,244,.56);font-weight:300;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}

/* Die Lautstärke ist die zweite Zahl des Geräts — gross, dünn, ohne Einheit */
.laut{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.laut b{font-weight:200;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  line-height:.92}

.bahn{position:relative;background:rgba(241,243,244,.13)}
.bahn i{position:absolute;left:0;top:0;bottom:0;background:#F1F3F4}
.zeit{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:rgba(241,243,244,.56);font-variant-numeric:tabular-nums}
.taste{display:flex;align-items:center;justify-content:center;color:rgba(241,243,244,.56)}
.taste.haupt{color:#F1F3F4}
.bib{display:inline-flex;align-items:center;color:rgba(241,243,244,.56);
  letter-spacing:.24em;text-transform:uppercase;font-weight:500}

/* Ruhezustand: der eingravierte Schriftzug in der blanken Scheibe */
.gravur{letter-spacing:.42em;text-transform:uppercase;color:rgba(241,243,244,.26);
  font-weight:500;text-align:center}

.zeile{display:flex;align-items:baseline;border-top:1px solid rgba(241,243,244,.13)}
.zeile:last-child{border-bottom:1px solid rgba(241,243,244,.13)}
.zeile .nr{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:rgba(241,243,244,.26);flex:none}
.zeile .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;color:rgba(241,243,244,.56)}
.zeile .d{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:rgba(241,243,244,.26);flex:none}
.zeile.an .t{color:#F1F3F4}
.zeile.an .nr{color:#F1F3F4}

</style></head><body><div class="stage"><div style="position:absolute;inset:0;display:flex;
  flex-direction:column;align-items:center;justify-content:space-between;
  padding:64px 0 58px">
  <div class="gravur" style="font-size:19px">Musiklib</div>
  <div class="feld" style="width:1600px;height:480px;
  padding:42px 56px">

  <div style="display:flex;align-items:baseline;justify-content:space-between;
    gap:40px">
    <span class="bib" style="gap:12px;font-size:20px">
      <svg width="21" height="21" viewBox="0 0 24 24"><rect x="3" y="4" width="3" height="16" rx="1" fill="rgba(241,243,244,.56)"/><rect x="8" y="4" width="3" height="16" rx="1" fill="rgba(241,243,244,.56)"/><path d="M14.5 5.4 L18.2 4.5 L21.5 19 L17.8 19.9 Z" fill="rgba(241,243,244,.56)"/></svg>Sammlung · 240 Alben</span>
    <span class="kap" style="font-size:20px">FLAC · 24 Bit · 96 kHz</span>
  </div>

  <div style="display:flex;align-items:flex-end;justify-content:space-between;
    gap:56px;min-width:0">
    <div style="min-width:0">
      <div class="titel" style="font-size:78px">Blue in Green</div>
      <div class="unterzeile" style="font-size:30px;
        margin-top:12px">
        Miles Davis · Kind of Blue · 1959</div>
    </div>
    <div class="laut">
      <span class="kap" style="font-size:17px;
        margin-bottom:10px">Lautstärke</span>
      <b style="font-size:116px">60</b>
    </div>
  </div>

  <div>
    <div class="bahn" style="height:3px">
      <i style="width:40%"></i></div>
    <div style="display:flex;align-items:center;justify-content:space-between;
      margin-top:20px">
      <span class="zeit" style="font-size:22px">02:14</span>
      <div style="display:flex;align-items:center;gap:52px">
        <span class="taste"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M7 5v14M20 5v14l-11-7z" stroke="rgba(241,243,244,.56)" stroke-width="2" fill="rgba(241,243,244,.56)" stroke-linejoin="round"/></svg></span>
        <span class="taste haupt"><svg width="38" height="38" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" fill="#F1F3F4"/><rect x="14" y="5" width="4" height="14" fill="#F1F3F4"/></svg></span>
        <span class="taste"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M17 5v14M4 5v14l11-7z" stroke="rgba(241,243,244,.56)" stroke-width="2" fill="rgba(241,243,244,.56)" stroke-linejoin="round"/></svg></span>
        <span class="taste"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="rgba(241,243,244,.56)" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 L21 21"/></svg></span>
        <span class="taste" style="gap:10px">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="rgba(241,243,244,.56)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="rgba(241,243,244,.56)"/><path d="M17 9.5a4 4 0 0 1 0 5"/><path d="M19.5 7a7.5 7.5 0 0 1 0 10"/></svg></span>
      </div>
      <span class="zeit" style="font-size:22px">-03:23</span>
    </div>
  </div>
</div>
  <div class="gravur" style="font-size:15px">Anzeigefeld 1600 × 480</div>
</div></div></body></html>
