<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:2340px;overflow:hidden}
.stage{position:relative;width:1080px;height:2340px;overflow:hidden}

.stage{background:linear-gradient(160deg,#e9eaec 0%,#c9ccd0 54%,#dfe1e4 100%);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#f2f3f4}

.pult{position:relative;border-radius:20px;
  background:linear-gradient(168deg,#303338 0%,#1b1c1e 18%,#0f1012 100%);
  box-shadow:0 30px 70px rgba(30,34,40,.45),
             inset 0 2px 0 rgba(255,255,255,.14)}

.schirm{position:relative;overflow:hidden;background:#0b0c0d;
  border-radius:12px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.nr{position:absolute;font-weight:800;color:#e86a1e;line-height:.78;
  letter-spacing:-.05em;opacity:.9}

/* Die Kacheln sind die Sammlung — quadratisch, mit einem Namen darunter */
.kacheln{display:grid}
.kach{border-radius:7px;background:#232629;display:flex;
  align-items:flex-end;padding:7px;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.kach span{font-size:inherit;color:rgba(242,243,244,.55);line-height:1.15;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.kach.bib{background:#e86a1e}
.kach.bib span{color:#1a0d03;font-weight:700}

/* Schieber: Nut, Kappe, Beschriftung — senkrecht wie waagerecht dieselbe Form */
.nut{position:relative;background:#0c0d0e;border-radius:999px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.kappe{position:absolute;border-radius:4px;
  background:linear-gradient(180deg,#4b4f54 0%,#1e2124 60%,#101214 100%);
  box-shadow:0 3px 7px rgba(0,0,0,.55)}
.band{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:rgba(242,243,244,.20);text-align:center}

.pad{border-radius:9px;background:#232629;display:flex;
  align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),
             0 3px 7px rgba(0,0,0,.4)}
.pad.weiss{background:#eef0f1}
.pad.orange{background:#e86a1e}
.zeiten{display:flex;justify-content:space-between;font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:rgba(242,243,244,.55);
  font-variant-numeric:tabular-nums}

</style></head><body><div class="stage"><div style="position:absolute;inset:0;display:flex;align-items:center;
