<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:2340px;overflow:hidden}
.stage{position:relative;width:1080px;height:2340px;overflow:hidden}

.stage{background:#efe8da;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#3a3630}
.korn{position:absolute;inset:0;pointer-events:none;opacity:.45;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.028) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.022) 0 1px, transparent 1px 4px)}

/* Bibliothek: die Marke oben links ist der Zugang, wie die Signatur des Drucks */
.marke{display:flex;align-items:center}
.markentext{text-transform:uppercase;letter-spacing:4.0px;line-height:1.35}
.markentext b{display:block;font-weight:700;letter-spacing:5.0px}
.markentext span{display:block;color:#8b857a;font-size:.68em}

.zeiten{display:flex;justify-content:space-between;font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:#8b857a;
  font-variant-numeric:tabular-nums}
.spur{position:relative;height:3px;background:rgba(58,54,48,.20)}
.spur i{position:absolute;left:0;top:0;bottom:0;background:#d4653c}

/* Schieber und Knöpfe sind gedruckt, nicht plastisch: flache Flächen, harte Kanten */
.schieber{position:relative;background:#5b83a8;border-radius:4px}
.schieber .schlitz{position:absolute;left:50%;transform:translateX(-50%);
  background:#7b3524;border-radius:2px}
.schieber .griff{position:absolute;left:50%;transform:translate(-50%,-50%);
  background:#d4653c;border-radius:3px;box-shadow:0 0 0 3px #efe8da}
.knopf{position:relative;border-radius:50%;display:flex;align-items:center;
  justify-content:center}
.knopf i{position:absolute;background:#7b3524;border-radius:2px;transform-origin:center}

</style></head><body><div class="stage"><div class="korn"></div>
