<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:2340px;overflow:hidden}
.stage{position:relative;width:1080px;height:2340px;overflow:hidden}

.stage{background:#000;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#f4f4f2}
.wort{display:flex;align-items:center;line-height:.86;font-weight:800;letter-spacing:-.03em}

/* Die Kapsel ist der Buchstabe: sie sitzt bündig am Wort, kein Abstand */
.schalter{position:relative;border-radius:999px;flex-shrink:0}
.schalter b{position:absolute;top:50%;transform:translateY(-50%);border-radius:50%;display:block}
.an{border:5px solid #f4f4f2}
.an b{background:#f4f4f2}
.aus{border:5px solid #e0342c}
.aus b{background:transparent;border:4px solid #f4f4f2}

.ueber{letter-spacing:18px;font-weight:400;text-transform:uppercase;color:#f4f4f2}
.linie{position:relative;height:2px;background:rgba(244,244,242,.22)}
.linie i{position:absolute;left:0;top:0;bottom:0;background:#f4f4f2}
.linie b{position:absolute;top:50%;transform:translate(-50%,-50%);border-radius:50%;
  background:#f4f4f2}
.zeiten{display:flex;justify-content:space-between;font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:rgba(244,244,242,.45);
  font-variant-numeric:tabular-nums}

/* Bibliothek: derselbe Umriss wie die Schalter, damit sie dazugehört */
.bib{display:inline-flex;align-items:center;border-radius:999px;
  border:2px solid rgba(244,244,242,.40);text-transform:uppercase}
.pfeil{background:none;display:flex;align-items:center;justify-content:center}

</style></head><body><div class="stage"><div style="position:absolute;inset:0;padding:150px 76px 130px;
  display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;justify-content:space-between">
    <span class="ueber" style="font-size:23px">Musiklib</span>
    <span class="bib" style="height:68px;padding:0 30px;gap:16px;font-size:21px;letter-spacing:4.0px"><svg width="26" height="26" viewBox="0 0 24 24"><rect x="3" y="4" width="3" height="16" rx="1" fill="#f4f4f2"/><rect x="8" y="4" width="3" height="16" rx="1" fill="#f4f4f2"/><path d="M14.5 5.4 L18.2 4.5 L21.5 19 L17.8 19.9 Z" fill="#f4f4f2"/></svg>Sammlung · 240</span>
  </div>

  <div style="margin-top:auto;margin-bottom:auto">
    <div class="ueber" style="font-size:38px;margin-bottom:26px">Musik</div>
    <div class="wort" style="font-size:168px;color:#f4f4f2"><span class="schalter an" style="width:235px;height:128px"><b style="right:8px;width:108px;height:108px"></b></span><span style="margin-left:-6px">N</span></div>
    <div class="ueber" style="font-size:38px;margin:74px 0 26px">Welt</div>
    <div class="wort" style="font-size:168px;color:#e0342c"><span class="schalter aus" style="width:235px;height:128px"><b style="left:8px;width:108px;height:108px"></b></span><span style="margin-left:-6px">FF</span></div>
  </div>

  <div style="font-size:52px;font-weight:700;letter-spacing:-.02em">Blue in Green</div>
  <div style="font-size:30px;color:rgba(244,244,242,.45);margin-top:12px">Miles Davis · Kind of Blue</div>

  <div class="linie" style="margin-top:44px">
    <i style="width:40%"></i>
    <b style="left:40%;width:22px;height:22px"></b></div>
  <div class="zeiten" style="font-size:25px;margin-top:20px">
    <span>02:14</span><span>05:37</span></div>

  <div style="display:flex;align-items:center;justify-content:center;gap:120px;margin-top:56px">
    <span class="pfeil"><svg width="66" height="66" viewBox="0 0 24 24" fill="none" stroke="#f4f4f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-8 7 8 7"/></svg></span><span class="pfeil"><svg width="66" height="66" viewBox="0 0 24 24" fill="none" stroke="#f4f4f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l8 7-8 7"/></svg></span></div>
</div></div></body></html>
