<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:2340px;overflow:hidden}
.stage{position:relative;width:1080px;height:2340px;overflow:hidden}

.stage{background:#e6e1d4;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#22201c}
.schrift{position:absolute;inset:0;pointer-events:none}
.schrift svg{width:100%;height:100%;display:block}

/* Pinselzug: zwei sehr weiche Lagen, die das Papier ungleichmäßig machen */
.zug{position:absolute;inset:0;pointer-events:none;opacity:.55;
  background:
    radial-gradient(60% 40% at 22% 18%, rgba(255,252,244,.85) 0%, rgba(255,252,244,0) 60%),
    radial-gradient(50% 34% at 78% 74%, rgba(120,110,92,.22) 0%, rgba(120,110,92,0) 62%)}

.objekt{filter:drop-shadow(10px 16px 12px rgba(40,34,26,.45))}

/* Der Fortschritt ist ein gezogener Strich, kein Balken */
.strich{position:relative;height:10px}
.strich .grund{position:absolute;inset:0;border-radius:5px;
  background:rgba(34,32,28,.16)}
.strich i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;
  background:linear-gradient(90deg,#d95f2e,#e07a3c)}
.strich b{position:absolute;top:50%;transform:translate(-50%,-50%) rotate(-8deg);
  background:#3f8f96;border-radius:3px}
.zeiten{display:flex;justify-content:space-between;font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:#6f6a5e;
  font-variant-numeric:tabular-nums}

.taste{flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,253,246,.72);
  box-shadow:4px 6px 10px rgba(40,34,26,.30)}
.taste.gross{background:#d95f2e;
  box-shadow:6px 9px 16px rgba(150,60,20,.45)}
.bib{display:inline-flex;align-items:center;border-radius:999px;
  background:rgba(255,253,246,.78);text-transform:uppercase;
  box-shadow:4px 6px 12px rgba(40,34,26,.28)}
