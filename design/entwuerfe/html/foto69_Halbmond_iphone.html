<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:2340px;overflow:hidden}
.stage{position:relative;width:1080px;height:2340px;overflow:hidden}

.stage{background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.020) 0 1px,rgba(0,0,0,.05) 1px 3px),
    radial-gradient(140% 120% at 50% 40%,#1E2021 0%,#131415 58%,#0A0B0C 100%);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#F2F3F4;-webkit-font-smoothing:antialiased}
.kap{letter-spacing:.26em;text-transform:uppercase;color:rgba(242,243,244,.30);font-weight:500}

/* ── Der Halbmond ───────────────────────────────────────────────────────
   Ein Chromring, darin eine Kappe, die zur Hälfte poliert und zur Hälfte
   schwarz ist. Die Kante zwischen beiden Hälften ist die Stellung — deshalb
   ist sie gerade und nicht gezackt. */
.mond{position:relative;border-radius:50%;
  background:conic-gradient(from 90deg,#E9EAEC 0deg 180deg,#111213 180deg 360deg);
  box-shadow:0 0 0 5px #C6C8CB,0 0 0 7px #4A4C4F,
    0 10px 26px rgba(0,0,0,.6),
    inset 0 4px 12px rgba(255,255,255,.28)}
.mond::after{content:'';position:absolute;inset:0;border-radius:50%;
  background:linear-gradient(160deg,rgba(255,255,255,.32) 0%,rgba(255,255,255,0) 46%)}
.mlab{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;letter-spacing:.22em;text-transform:uppercase;color:rgba(242,243,244,.30);
  text-align:center}

/* ── Der Schlitz: schmales Display, in das Blech eingelassen ── */
.schlitz{position:relative;background:#08090A;border-radius:2px;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.9),inset 0 4px 14px rgba(0,0,0,.9),
    0 1px 0 rgba(255,255,255,.09)}
.stitel{font-weight:500;letter-spacing:-.01em;text-align:center;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.sunter{color:rgba(242,243,244,.62);text-align:center;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.szeit{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:rgba(242,243,244,.62);font-variant-numeric:tabular-nums}
.sbahn{position:relative;background:rgba(242,243,244,.16);border-radius:1px;overflow:hidden}
.sbahn i{position:absolute;left:0;top:0;bottom:0;background:#F2F3F4}

/* ── Die fünf Punkte ── kleiner geht es nicht, und das ist die Aussage. ── */
.punkt{border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 36% 30%,#C9CBCE,#6E7175 70%,#3A3C3F);
  box-shadow:0 1px 3px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.4)}
.marke{position:absolute;left:50%;transform:translateX(-50%);font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;
  letter-spacing:.3em;text-transform:uppercase;color:rgba(242,243,244,.30)}

</style></head><body><div class="stage"><div style="position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:space-between;padding:110px 60px 120px">
  <div style="width:100%;display:flex;justify-content:space-between">
    <span class="kap" style="font-size:19px">Musiklib</span>
    <span class="kap" style="font-size:19px">240 Alben</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:70px;width:100%">
    <div class="schlitz" style="width:940px;height:210px;padding:14px
  26px;display:flex;flex-direction:column;justify-content:center;
  gap:6px">
  <div class="stitel" style="font-size:63px">Blue in Green</div>
  <div class="sunter" style="font-size:40px">Miles Davis</div>
  <div style="display:flex;align-items:center;gap:14px;margin-top:6px">
    <span class="szeit" style="font-size:32px">02:14</span>
    <span class="sbahn" style="flex:1;height:9px">
      <i style="width:40%"></i></span>
    <span class="szeit" style="font-size:32px">05:37</span>
  </div>
</div>
    <div style="display:flex;align-items:center;gap:59px"><span class="punkt" style="width:54px;height:54px"><svg width="27" height="27" viewBox="0 0 24 24"><path d="M7 5v14M20 5v14l-11-7z" stroke="#1A1C1E" stroke-width="2" fill="#1A1C1E" stroke-linejoin="round"/></svg></span><span class="punkt" style="width:54px;height:54px"><svg width="29" height="29" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" fill="#1A1C1E"/><rect x="14" y="5" width="4" height="14" fill="#1A1C1E"/></svg></span><span class="punkt" style="width:54px;height:54px"><svg width="27" height="27" viewBox="0 0 24 24"><path d="M17 5v14M4 5v14l11-7z" stroke="#1A1C1E" stroke-width="2" fill="#1A1C1E" stroke-linejoin="round"/></svg></span><span class="punkt" style="width:54px;height:54px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1A1C1E" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 L21 21"/></svg></span><span class="punkt" style="width:54px;height:54px"><svg width="24" height="24" viewBox="0 0 24 24"><rect x="3" y="4" width="3" height="16" rx="1" fill="#1A1C1E"/><rect x="8" y="4" width="3" height="16" rx="1" fill="#1A1C1E"/><path d="M14.5 5.4 L18.2 4.5 L21.5 19 L17.8 19.9 Z" fill="#1A1C1E"/></svg></span></div>
  </div>
  <div style="display:flex;align-items:center;gap:90px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:20px"><span class="mlab" style="font-size:15px">Quelle</span><span class="mond" style="width:300px;height:300px"></span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:20px"><span class="mlab" style="font-size:15px">Lautstärke</span><span class="mond" style="width:300px;height:300px"></span></div>
  </div>
</div></div></body></html>
