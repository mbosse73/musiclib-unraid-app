*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:1000px;overflow:hidden}
.stage{position:relative;width:1600px;height:1000px;overflow:hidden}

.stage{background:
    radial-gradient(120% 100% at 14% -8%,#EAE3D4 0%,#D7CDB8 58%,#CEC3AC 100%);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#6C6355;-webkit-font-smoothing:antialiased}
/* Kalk ist nicht glatt. Das Korn ist ein Muster, kein Bild — sonst waere es
   eine Textur-Datei, und die Blaetter haben keine. */
.stage::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:
    repeating-linear-gradient(64deg,rgba(255,255,255,.5) 0 1px,rgba(0,0,0,.018) 1px 4px),

.grav{text-shadow:0 1px 0 rgba(255,255,255,.75)}
.kap{font-size:13px;letter-spacing:.30em;text-transform:uppercase;
  color:rgba(108,99,85,.62);text-shadow:0 1px 0 rgba(255,255,255,.75)}
.werk{font-family:Georgia,'Times New Roman',ui-serif,serif;font-size:46px;line-height:1.04;color:#4A4335;
  letter-spacing:-.012em;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.wer{font-family:Georgia,'Times New Roman',ui-serif,serif;font-style:italic;font-size:24px;
  color:rgba(108,99,85,.78);margin-top:10px}
.uhr{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;font-size:20px;color:#4A4335;
  font-variant-numeric:tabular-nums;text-shadow:0 1px 0 rgba(255,255,255,.7)}
/* Ein Messingstift sitzt in der Platte: Loch, Rand, Kuppe. */
.stift{display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#E2C57E 0%,#A8843C 46%,#8A6A2C 100%);

    0 0 0 1px rgba(0,0,0,.14),0 2px 5px rgba(74,67,53,.30)}
