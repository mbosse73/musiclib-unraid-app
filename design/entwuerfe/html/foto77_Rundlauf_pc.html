<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:1000px;overflow:hidden}
.stage{position:relative;width:1600px;height:1000px;overflow:hidden}

.stage{background:linear-gradient(180deg,#DAD5C9 0%,#C9C3B4 100%);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#3B382F;-webkit-font-smoothing:antialiased}
/* Gebürstet: feine Striche, nicht als Bild, sondern als Verlaufsmuster. */
.stage::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.30) 0 1px,
    rgba(0,0,0,.03) 1px 3px);opacity:.35}
/* Gravur heisst: die Schrift steht tiefer als die Platte, also ein weisser
   Lichtsaum unten. Ohne den ist es Aufdruck. */
.grav{text-shadow:0 1px 0 rgba(255,255,255,.62)}
.kap{font-size:13px;letter-spacing:.30em;text-transform:uppercase;
  color:rgba(59,56,47,.52);font-weight:600;text-shadow:0 1px 0 rgba(255,255,255,.62)}
.glas{position:relative;background:
    linear-gradient(180deg,#1E1B14 0%,#17150F 46%,#100E09 100%);
  border-radius:4px;overflow:hidden;
  box-shadow:inset 0 2px 13px rgba(0,0,0,.85),
    inset 0 -1px 0 rgba(255,255,255,.07),0 1px 0 rgba(255,255,255,.55)}
.glas::after{content:'';position:absolute;left:0;right:0;top:0;height:34%;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0))}
.lauf{font-size:46px;font-weight:300;color:#F3E9D2;letter-spacing:-.01em}
.unter{font-size:22px;font-weight:300;color:rgba(243,233,210,.46);margin-top:8px}
.stand{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;font-size:46px;color:#F3E9D2;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rest{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;font-size:17px;color:rgba(243,233,210,.46);
  font-variant-numeric:tabular-nums}
/* Die Platte liegt in der Front, nicht darauf: innen Schatten, aussen Licht. */
.plat{background:#CFC9BB;border-radius:4px;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.20),inset 0 -1px 0 rgba(255,255,255,.55),
    0 1px 0 rgba(255,255,255,.55)}
.z{display:flex;align-items:center;gap:21px;
  border-bottom:1px solid rgba(59,56,47,.13)}
.z:last-child{border-bottom:0}
.z .nr{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;font-size:13px;color:rgba(59,56,47,.52);flex:none;
  font-variant-numeric:tabular-nums}
.z .na{font-size:22px;color:#3B382F;flex:1;min-width:0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.z .da{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;font-size:17px;color:rgba(59,56,47,.52);flex:none;
  font-variant-numeric:tabular-nums}
.z.jetzt .na{color:#C8802E;font-weight:500}
.z.jetzt .nr{color:#C8802E}
/* Eine Taste hat eine Kante, sonst ist sie ein Zeichen auf einer Fläche. */
.taste{display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#3A362E 0%,#232019 100%);
  border-radius:4px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 2px 3px rgba(0,0,0,.28),
    0 1px 0 rgba(255,255,255,.5)}
