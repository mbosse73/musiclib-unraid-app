<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:1000px;overflow:hidden}
.stage{position:relative;width:1600px;height:1000px;overflow:hidden}

.stage{background:linear-gradient(105deg,#9d9d9f 0%,#c9c9cb 34%,#a8a8aa 62%,#8e8e90 100%);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#3a3a3c}

.wort{text-transform:uppercase;color:rgba(58,58,60,.28);font-weight:600}

.zeiten{display:flex;justify-content:space-between;font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:rgba(58,58,60,.62);
  font-variant-numeric:tabular-nums}
