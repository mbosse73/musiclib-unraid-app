<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:1000px;overflow:hidden}
.stage{position:relative;width:1600px;height:1000px;overflow:hidden}

.stage{background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.020) 0 1px,rgba(0,0,0,.06) 1px 4px),
    linear-gradient(180deg,#151617 0%,#0D0E0F 46%,#08090A 100%);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:rgba(240,240,238,.72);-webkit-font-smoothing:antialiased}
.kap{letter-spacing:.28em;text-transform:uppercase;color:rgba(240,240,238,.30);font-weight:500}

/* ── Die Platte: gebürstetes Champagnersilber, gewölbt, mit weicher Kante ── */
.platte{position:relative;border-radius:10px;overflow:hidden;color:#26241E;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.20) 0 1px,rgba(0,0,0,.045) 1px 3px),
    linear-gradient(180deg,#F1EDE1 0%,#DCD8CC 40%,#B6B2A5 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.9),
    inset 0 -2px 0 rgba(0,0,0,.28),
    0 0 0 2px #3A3B3C,0 14px 34px rgba(0,0,0,.7)}
.plab{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;letter-spacing:.24em;text-transform:uppercase;color:rgba(38,36,30,.40)}
.ptitel{font-weight:400;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.pzeit{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:rgba(38,36,30,.62);font-variant-numeric:tabular-nums}

/* Die Warteschlange auf der Platte: Striche, einer davon voll. */
.qz{display:flex;align-items:flex-end;gap:4px}
.qz i{display:block;border-radius:1px;background:rgba(38,36,30,.26)}
.qz i.vor{background:rgba(38,36,30,.52)}
.qz i.jetzt{background:#26241E}

/* ── Der eine Knopf: ein Ring, sonst nichts. ── */
.knopf{position:relative;border-radius:50%;display:flex;align-items:center;
  justify-content:center;background:transparent;
  box-shadow:inset 0 0 0 2px rgba(240,240,238,.72),
    0 0 26px rgba(240,240,238,.10)}
.klab{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;letter-spacing:.26em;text-transform:uppercase;
  color:rgba(240,240,238,.30);text-align:center}
