<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:1000px;overflow:hidden}
.stage{position:relative;width:1600px;height:1000px;overflow:hidden}

/* Der Kunststoffkasten ist die Bühne selbst — kein Gerät auf einem Tisch */
.stage{background:linear-gradient(168deg,#e8843f 0%,#cf5f1e 30%,#9d4413 100%);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#3a1a06}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.42),
             inset 0 -3px 27px rgba(60,30,10,.30)}

/* Das Fenster ist eingelassen, nicht aufgesetzt */
.fenster{background:#131313;border-radius:9px;
  box-shadow:inset 0 3px 11px rgba(0,0,0,.85),
             0 0 0 2px rgba(0,0,0,.28)}

/* Ein Fallblatt: Karte mit Naht in der Mitte und zwei Scharnieren */
.blatt{position:relative;border-radius:6px;overflow:hidden;
  background:linear-gradient(180deg,#2c2c2c 0%,#252525 49.6%,#1c1c1c 50.4%,#2a2a2a 100%);
  display:flex;align-items:center;justify-content:center;color:#f4f2ee;
  font-weight:500;font-variant-numeric:tabular-nums;line-height:1}
.blatt::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;
  transform:translateY(-50%);background:rgba(0,0,0,.75);
  box-shadow:0 1px 0 rgba(255,255,255,.12)}
.blatt b{position:absolute;top:50%;transform:translateY(-50%);width:5px;
  height:14px;background:#8d8d8d;border-radius:2px}

.spalte{display:flex;flex-direction:column;justify-content:center;
  color:rgba(244,242,238,.72);font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;font-variant-numeric:tabular-nums;
  text-align:center}
.spalte .jetzt{color:#f4f2ee}

/* Der Knopf: schwarz, mit dem eingeprägten Pfeil aus dem Foto */
.knopf{position:relative;border-radius:50%;flex-shrink:0;
  background:radial-gradient(circle at 34% 28%,#5a5a5a 0%,#1d1d1d 46%,#0a0a0a 100%);
  box-shadow:0 6px 12px rgba(40,20,5,.5)}

.bahn{position:relative;background:rgba(58,26,6,.26);border-radius:999px}
.bahn i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:#3a1a06}
.zeiten{display:flex;justify-content:space-between;font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;
  color:rgba(58,26,6,.62);font-variant-numeric:tabular-nums}

/* Die Tasten sind flach in den Kunststoff gesetzt */
.taste{flex-shrink:0;display:flex;align-items:center;justify-content:center;
  border-radius:5px;background:rgba(58,26,6,.20);
  box-shadow:inset 0 2px 3px rgba(0,0,0,.22)}
.bib{display:inline-flex;align-items:center;border-radius:999px;background:#f4f2ee;
  color:#3a1a06;text-transform:uppercase;font-weight:700}
.marke{text-transform:uppercase;font-weight:800;color:rgba(58,26,6,.42)}
