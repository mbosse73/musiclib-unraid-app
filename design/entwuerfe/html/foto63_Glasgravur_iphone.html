<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:2340px;overflow:hidden}
.stage{position:relative;width:1080px;height:2340px;overflow:hidden}

.stage{background:linear-gradient(180deg,#17171A 0%,#0E0E10 34%,#141416 100%);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#F4F2EC;-webkit-font-smoothing:antialiased}
.kap{letter-spacing:.26em;text-transform:uppercase;color:rgba(244,242,236,.34);font-weight:500}
.bib{display:inline-flex;align-items:center;color:rgba(244,242,236,.34);letter-spacing:.24em;
  text-transform:uppercase;font-weight:500}

/* ── Die Scheibe ────────────────────────────────────────────────────────
   Schwarzes Glas: oben ein schmaler Lichtreflex, sonst tief. Was darauf
   liegt, liegt in Wahrheit dahinter — deshalb die helle Oberkante an jedem
   Strich und der Schatten darunter. */
.glas{position:relative;overflow:hidden;background:
    linear-gradient(180deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.015) 9%,
      rgba(0,0,0,0) 26%),#0A0B0D;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09),
    inset 0 13px 28px rgba(0,0,0,.75),
    0 11px 31px rgba(0,0,0,.55)}
.gr{position:absolute;background:rgba(244,242,236,.46);transform:translateX(-50%);
  box-shadow:0 -1px 0 rgba(255,255,255,.30),0 1px 2px rgba(0,0,0,.9)}
.gr.gross{background:#F4F2EC}
.zahl{position:absolute;font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:#F4F2EC;transform:translateX(-50%);
  font-variant-numeric:tabular-nums;
  text-shadow:0 -1px 0 rgba(255,255,255,.35),0 1px 3px rgba(0,0,0,.95)}
.marke{position:absolute;transform:translateX(-50%);border-radius:2px;
  background:linear-gradient(180deg,#8FDCFF 0%,#4FC3F7 55%,#1E88C7 100%);
  box-shadow:0 0 20px 6px rgba(79,195,247,.55),
    0 0 55px 17px rgba(79,195,247,.22)}
.schrift{position:absolute;font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;letter-spacing:.10em;
  text-transform:uppercase;color:rgba(244,242,236,.62)}

/* ── Die Blende ── gebürstetes Aluminium, waagerechte Faser. */
.blende{position:relative;background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.10) 0 1px,
      rgba(0,0,0,.05) 1px 3px),
    linear-gradient(180deg,#D3D1CA 0%,#B9B7B0 46%,#9C9A93 100%);
  color:#26262A;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(0,0,0,.35),
    0 6px 17px rgba(0,0,0,.45)}
.blende .kap{color:rgba(38,38,42,.55)}

/* Der Kippschalter: ein schwarzer Hebel in einer gefrästen Nut. Gedrückt
   heisst hier oben — die Haupttaste steht anders als die anderen. */
.kipp{position:relative;display:flex;align-items:flex-end;justify-content:center;
  border-radius:3px;background:linear-gradient(180deg,#8E8C85,#C6C4BD);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.55)}
.kipp i{display:block;border-radius:2px;
  background:linear-gradient(180deg,#3A3A3E 0%,#111113 60%,#26262A 100%);
  box-shadow:0 2px 5px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.16)}
.kipp.an i{background:linear-gradient(180deg,#26262A 0%,#111113 40%,#3A3A3E 100%)}
.kipplab{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(38,38,42,.62);text-align:center}

/* Der gerändelte Knopf — die Rändelung ist gezeichnet, nicht behauptet. */
.knopf{border-radius:50%;position:relative;background:
    repeating-conic-gradient(from 0deg,#EDEBE4 0deg 2deg,#A8A69F 2deg 4deg),
    radial-gradient(circle at 34% 28%,#FFFFFF,#9B9992);
  box-shadow:inset 0 0 0 3px #CFCDC6,0 4px 9px rgba(0,0,0,.45)}
.knopf::after{content:'';position:absolute;left:50%;top:8px;width:2px;
  height:34%;transform:translateX(-50%);background:#26262A;border-radius:1px}
.zeit{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:rgba(244,242,236,.34);font-variant-numeric:tabular-nums}
