<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:1000px;overflow:hidden}
.stage{position:relative;width:1600px;height:1000px;overflow:hidden}

.stage{background:
  radial-gradient(70% 50% at 32% 26%, #4a2c18 0%, #2a1710 45%, #150c08 100%);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#f6e3c8}

/* Das Licht des Schildes auf der Wand */
.wandlicht{position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,190,110,.32) 0%,rgba(255,190,110,.10) 40%,rgba(255,190,110,0) 70%)}

/* Neon: Kern weiss, Hülle bernstein — vier Schattenlagen machen die Röhre */
.neon{color:#fff6e2;font-weight:800;letter-spacing:-.01em;line-height:1.04;
  text-shadow:0 0 4px #fff4dd, 0 0 13px #ffcf7a,
    0 0 32px rgba(255,190,110,.85), 0 0 69px rgba(255,190,110,.45)}
.neonklein{color:#ffcf7a;letter-spacing:4.3px;text-transform:uppercase;
  text-shadow:0 0 6px rgba(255,190,110,.9), 0 0 19px rgba(255,190,110,.5)}

/* Die Röhre unter dem Schild ist zugleich die Spulleiste */
.rohr{position:relative;border-radius:999px;background:rgba(255,207,122,.16)}
.rohr i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:#ffcf7a;
  box-shadow:0 0 10px rgba(255,190,110,.95), 0 0 29px rgba(255,190,110,.55)}
.rohr b{position:absolute;top:50%;transform:translate(-50%,-50%);border-radius:50%;
  background:#fff6e2;box-shadow:0 0 12px rgba(255,190,110,.95)}
.zeiten{display:flex;justify-content:space-between;font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:rgba(246,227,200,.55);
  font-variant-numeric:tabular-nums}

/* Sideboard und Gerät */
.brett{position:absolute;background:linear-gradient(180deg,#5a3a22,#3a2416)}
.geraet{position:relative;background:linear-gradient(180deg,#c9a271,#9c7746);
  box-shadow:0 19px 36px rgba(0,0,0,.55)}
.haube{position:absolute;border:1px solid rgba(255,190,120,.42);
  border-bottom:none;background:linear-gradient(180deg,rgba(255,190,120,.10),rgba(255,190,120,.02))}
.front{position:absolute;left:0;right:0;bottom:0;background:#1d150e;
  border-top:1px solid rgba(255,190,120,.20)}

.taste{flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,190,120,.35);background:rgba(255,190,120,.06)}
.taste.gross{background:rgba(255,207,122,.16);border-color:#ffcf7a;
  box-shadow:0 0 17px rgba(255,190,110,.55), inset 0 0 14px rgba(255,190,110,.28)}
.bib{display:inline-flex;align-items:center;border-radius:999px;
  border:1px solid rgba(255,190,120,.35)}
