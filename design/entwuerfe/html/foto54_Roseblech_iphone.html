<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:2340px;overflow:hidden}
.stage{position:relative;width:1080px;height:2340px;overflow:hidden}

/* Gebürstetes Blech, und zwar die ganze Fläche: ein Verlauf plus feine
   Striche in Laufrichtung */
.stage{background:linear-gradient(158deg,#e6c6ba 0%,#d3ac9f 42%,#b98c7c 100%);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#241a16}
.stage::before{content:"";position:absolute;inset:0;opacity:.28;pointer-events:none;
  background:repeating-linear-gradient(112deg,rgba(255,255,255,.5) 0 1px,
    rgba(0,0,0,.05) 1px 3px)}
.platte{position:absolute;inset:0;display:flex}

/* Schiene: links gefüllt, rechts dunkel — wie der Schieber im Foto */
.schiene{position:relative;display:flex;align-items:center}
.schiene .bahn{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  border-radius:999px;background:#3b3330}
.schiene .bahn i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;
  background:#b8352c}
.griff{position:relative;border-radius:50%;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;
  background:radial-gradient(circle at 34% 26%,#fbfaf9 0%,#d6d2ce 48%,#a19c97 100%);
  box-shadow:0 4px 9px rgba(0,0,0,.35),
             0 0 0 2px rgba(255,255,255,.55)}

.zeile{font-weight:800;letter-spacing:-.02em;text-align:center}
.dauer{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;font-weight:700;text-align:center;
  font-variant-numeric:tabular-nums}

/* Die Tasten sind Metallzylinder: heller Ring, gewölbte Fläche, harter Schatten */
.taste{position:relative;flex-shrink:0;border-radius:50%;display:flex;
  align-items:center;justify-content:center;
  background:radial-gradient(circle at 36% 26%,#fbfaf9 0%,#d6d2ce 52%,#a19c97 100%);
  box-shadow:0 8px 16px rgba(0,0,0,.38),
             0 0 0 5px rgba(255,255,255,.42),
             inset 0 -3px 6px rgba(0,0,0,.22)}
.taste.rot{background:radial-gradient(circle at 36% 26%,#e0574c 0%,#b8352c 54%,#7e2119 100%);
  box-shadow:0 8px 16px rgba(0,0,0,.42),
             0 0 0 5px rgba(255,255,255,.32),
             inset 0 -3px 6px rgba(0,0,0,.3)}

</style></head><body><div class="stage"><div class="platte" style="flex-direction:column;padding:90px 76px 96px">

an><span style="font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;font-size:25px;color:rgba(36,26,22,.62)">11:33</span></div>

</div></div></body></html>
