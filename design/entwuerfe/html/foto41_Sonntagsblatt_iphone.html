<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:2340px;overflow:hidden}
.stage{position:relative;width:1080px;height:2340px;overflow:hidden}

.stage{background:
  radial-gradient(120% 90% at 30% 10%, #e0dcd3 0%, #d7d3ca 55%, #c9c5bc 100%);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#26262a}

/* Die Pappe hat Korn — zwei sehr feine Streifenlagen über Kreuz */
.korn{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:
    repeating-linear-gradient(58deg, rgba(0,0,0,.035) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(-32deg, rgba(255,255,255,.05) 0 1px, transparent 1px 3px)}

.kopfzeile{display:flex;align-items:flex-start;justify-content:space-between}
.marke{display:flex;align-items:center;color:#7d7b76;text-transform:uppercase;
  letter-spacing:2.5px;line-height:1.25}
.datum{text-align:center;line-height:.95}
.datum b{display:block;font-weight:800}
.datum span{display:block;color:#7d7b76}

/* Schlagzeile: eng gesetzt, drei Zeilen, die dritte orange */
.schlag{font-weight:800;letter-spacing:-.035em;line-height:.88;text-align:center}
.schlag .zwei{display:block}
.schlag .drei{display:block;color:#f08a2c}

.linie{position:relative;background:rgba(38,38,42,.28)}
.linie i{position:absolute;left:0;top:0;bottom:0;background:#26262a}
.linie b{position:absolute;top:50%;transform:translate(-50%,-50%);border-radius:50%;
  background:#26262a}
.zeiten{display:flex;justify-content:space-between;font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:#7d7b76;
  font-variant-numeric:tabular-nums}
.tasten{display:flex;align-items:center;justify-content:center}
.ring{border-radius:50%;border:2px solid #26262a;display:flex;
  align-items:center;justify-content:center}

/* Die Objekte tragen den weissen Ausschneidestrich der Vorlage */
.objekt{filter:drop-shadow(0 14px 26px rgba(60,55,45,.32))}
.objekt > div{border-radius:10px;
  box-shadow:0 0 0 5px #fdfcfa}
.bib{display:inline-flex;align-items:center;border-radius:999px;
  border:2px solid rgba(38,38,42,.35);text-transform:uppercase}
.fuss{text-align:center;color:#7d7b76}

</style></head><body><div class="stage"><div class="korn"></div>
