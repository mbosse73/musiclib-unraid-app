<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:2340px;overflow:hidden}
.stage{position:relative;width:1080px;height:2340px;overflow:hidden}

.stage{background:linear-gradient(180deg,#1B1E21 0%,#0C0D0F 46%,#111315 100%);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#E8EEF0;-webkit-font-smoothing:antialiased}
.kap{letter-spacing:.26em;text-transform:uppercase;color:rgba(232,238,240,.34);font-weight:500}
.bib{display:inline-flex;align-items:center;color:rgba(232,238,240,.58);letter-spacing:.22em;
  text-transform:uppercase;font-weight:500}

/* ── Die grosse Skala: türkis auf Schwarz, hinter Glas ── */
.skala{position:relative;overflow:hidden;border-radius:2px;background:#17191C;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),
    inset 0 7px 18px rgba(0,0,0,.6)}
.tick{position:absolute;background:rgba(79,224,216,.42);transform:translateX(-50%)}
.tick.gross{background:#4FE0D8;box-shadow:0 0 6px rgba(79,224,216,.7)}
.zahl{position:absolute;font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:#4FE0D8;transform:translateX(-50%);
  font-variant-numeric:tabular-nums;text-shadow:0 0 9px rgba(79,224,216,.6)}
.nadel{position:absolute;transform:translateX(-50%);background:#FF7A2F;border-radius:1px;
  box-shadow:0 0 13px 3px rgba(255,122,47,.7)}
.slab{position:absolute;font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(79,224,216,.42)}

/* ── Die Merkplätze: fünf Schienen mit oranger Marke ─────────────────────
   Jede Schiene ist eine eigene kleine Skala; die Marke ist Platz und Stand
   in einem. */
.plaetze{display:flex;gap:14px}
.platz{display:flex;flex-direction:column;align-items:center;gap:9px}
.schiene{position:relative;border-radius:3px;background:
    linear-gradient(180deg,#0A0B0C,#16181B);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 2px 6px rgba(0,0,0,.7)}
.schiene i{position:absolute;left:50%;transform:translateX(-50%);width:2px;
  top:7px;bottom:7px;background:rgba(79,224,216,.42)}
.marke{position:absolute;left:50%;transform:translate(-50%,-50%);border-radius:2px;
  background:linear-gradient(180deg,#FFA268,#FF7A2F);
  box-shadow:0 0 9px rgba(255,122,47,.6),0 1px 2px rgba(0,0,0,.7)}
.platz.an .schiene{box-shadow:inset 0 0 0 1px rgba(79,224,216,.55),
    inset 0 2px 6px rgba(0,0,0,.7),0 0 13px rgba(79,224,216,.22)}
.pnr{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:#4FE0D8;font-variant-numeric:tabular-nums}
.pname{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;letter-spacing:.06em;color:rgba(232,238,240,.34);text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.platz.an .pname{color:rgba(232,238,240,.58)}

.taste{display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#33373B,#0E1012 78%);
  box-shadow:0 3px 7px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.14)}
.zeit{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:rgba(232,238,240,.34);font-variant-numeric:tabular-nums}
