*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:2340px;overflow:hidden}
.stage{position:relative;width:1080px;height:2340px;overflow:hidden}

.stage{background:
    radial-gradient(150% 120% at 50% 42%,#222427 0%,#101113 62%,#08090A 100%);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#ECEEF0;-webkit-font-smoothing:antialiased}

.kap{letter-spacing:.26em;text-transform:uppercase;color:rgba(236,238,240,.34);font-weight:500}
.bib{display:inline-flex;align-items:center;color:rgba(236,238,240,.34);letter-spacing:.26em;
  text-transform:uppercase;font-weight:500}
.titel{font-weight:300;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.unter{color:rgba(236,238,240,.60);font-weight:300;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}

/* ── Die Skala ──────────────────────────────────────────────────────────
   Ein gefrästes Blech: oben eine helle Kante, unten Schatten. Die Striche
   sitzen darauf, nicht darin. */
.skala{position:relative;border-radius:3px;
  background:linear-gradient(180deg,#1A1C1F 0%,#0C0D0F 46%,#141619 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.8),
    0 9px 22px rgba(0,0,0,.6)}
.strich{position:absolute;top:0;background:rgba(236,238,240,.42);transform:translateX(-50%)}
.strich.gross{background:rgba(236,238,240,.88)}
/* Die Titelgrenze ist der einzige Strich, der durchgeht. */
.strich.grenze{background:rgba(236,238,240,.88);opacity:.55}
.zahl{position:absolute;font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:rgba(236,238,240,.80);transform:translateX(-50%);
  font-variant-numeric:tabular-nums}

/* Die Schärfentiefe: ein Schleier, der genau dort durchsichtig ist, wo der
   Keil steht, und zu beiden Enden hin zumacht. Er liegt ÜBER den Strichen und
   nimmt ihnen den Kontrast — ein blur() auf der Skala würde auch den Keil
   weichzeichnen, und der ist das Einzige, was scharf bleiben muss.
   Deshalb wandert die klare Stelle mit der Marke: die Schärfe gehört zur
   Gegenwart, nicht zur Mitte des Blechs. */
.tiefe{position:absolute;inset:0;pointer-events:none;border-radius:inherit}

/* ── Der Keil ── Das einzige Licht im Bild. Kein Rahmen, keine Fläche:
   ein Dreieck, das glüht, und der Schein, den es auf das Blech wirft. */
.keil{position:absolute;transform:translateX(-50%)}
.keil .glut{position:absolute;left:50%;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,45,22,.60) 0%,rgba(255,45,22,0) 70%)}
.keil .spitze{position:relative;
  background:linear-gradient(180deg,#FF6A4E 0%,#FF2D16 42%,#B01608 100%);
  clip-path:polygon(50% 0%,100% 100%,0% 100%);
  filter:drop-shadow(0 0 8px rgba(255,45,22,.9))}

.taste{display:flex;align-items:center;justify-content:center;color:rgba(236,238,240,.60)}
.taste.haupt{color:#ECEEF0}
.zeit{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:rgba(236,238,240,.34);font-variant-numeric:tabular-nums}
