*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:1000px;overflow:hidden}
.stage{position:relative;width:1600px;height:1000px;overflow:hidden}

.stage{background:#d4502a;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#17150f}

/* Gelbe Versalien, eng gesetzt und im Anschnitt — wie gedruckt, nicht gesetzt */
.kopf{font-family:'Arial Narrow','Helvetica Neue Condensed',Arial,sans-serif;font-weight:800;color:#e9b43e;line-height:.84;
  letter-spacing:-.01em;text-transform:uppercase}

/* Passerversatz: dieselbe Zeile ein Haar daneben in Schwarz */
.passer{position:relative}
.passer .unter{position:absolute;left:2px;top:3px;
  color:#17150f;opacity:.30}

.tafel{background:#ead8ac;position:relative}
.tafel .korn{position:absolute;inset:0;opacity:.16;
  background:repeating-linear-gradient(90deg,#17150f 0 1px,transparent 1px 5px)}

.balken{position:relative;background:rgba(23,21,15,.22)}
.balken i{position:absolute;left:0;top:0;bottom:0;background:#c0301c}
.balken i::after{content:"";position:absolute;left:0;right:0;top:0;
  height:2px;background:#e9b43e;opacity:.75}
.zeiten{display:flex;justify-content:space-between;font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;
  color:rgba(23,21,15,.62);font-variant-numeric:tabular-nums}

.taste{flex-shrink:0;border-radius:50%;background:#17150f;display:flex;
  align-items:center;justify-content:center}
.taste.hell{background:#ead8ac}
.bib{display:inline-flex;align-items:center;background:#e9b43e;color:#17150f;
  text-transform:uppercase;font-weight:800;border-radius:999px}
