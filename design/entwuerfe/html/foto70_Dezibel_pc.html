<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:1000px;overflow:hidden}
.stage{position:relative;width:1600px;height:1000px;overflow:hidden}

.stage{background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.016) 0 1px,rgba(0,0,0,.05) 1px 3px),
    linear-gradient(180deg,#141618 0%,#0B0C0D 50%,#08090A 100%);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#EDEFF0;-webkit-font-smoothing:antialiased}
.kap{letter-spacing:.26em;text-transform:uppercase;color:rgba(237,239,240,.30);font-weight:500}

/* ── Das Fenster: hellblaues Blatt in einer schwarzen Fassung ── */
.werk{position:relative;border-radius:4px;overflow:hidden;
  background:radial-gradient(130% 150% at 50% 130%,#8ED8F0 0%,#6FC5E4 100%);
  box-shadow:inset 0 0 0 2px #05070A,
    inset 0 5px 14px rgba(10,40,60,.30),
    0 8px 22px rgba(0,0,0,.6)}
.wlab{position:absolute;left:0;right:0;text-align:center;font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;
  letter-spacing:.20em;text-transform:uppercase;color:rgba(18,24,28,.52)}
.wname{position:absolute;left:0;right:0;text-align:center;font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;
  letter-spacing:.26em;text-transform:uppercase;color:rgba(18,24,28,.78);font-weight:700}
/* Berührungszeichen: kein Rahmen, keine Fläche — nur das Zeichen. */
.zeichen{display:flex;align-items:center;justify-content:center;color:rgba(237,239,240,.58)}
.zeit{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:rgba(237,239,240,.30);font-variant-numeric:tabular-nums}
.titel{font-weight:300;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
