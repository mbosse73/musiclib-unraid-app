<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:2340px;overflow:hidden}
.stage{position:relative;width:1080px;height:2340px;overflow:hidden}

.stage{background:linear-gradient(180deg,#D6D6D2 0%,#BFBFBB 46%,#AAAAA6 100%);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#26262A;-webkit-font-smoothing:antialiased}
.kap{letter-spacing:.24em;text-transform:uppercase;color:rgba(38,38,42,.42);font-weight:500}
.gebuerstet{background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.17) 0 1px,rgba(0,0,0,.05) 1px 3px),
    linear-gradient(180deg,#D8D8D4 0%,#C6C6C2 44%,#A8A8A4 100%)}

/* ── Der Lautsprecherkorb: ein Punktraster hinter einem Ring ── */
.korb{position:relative;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#3E3E3C,#161616 76%);
  box-shadow:inset 0 0 0 5px #B4B4B0,inset 0 0 0 7px #8E8E8A,
    0 6px 16px rgba(0,0,0,.35)}
.korb::after{content:'';position:absolute;inset:7px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.10) 0 1px,rgba(0,0,0,.55) 1px 3px);
  background-size:6px 6px}

/* ── Das Fenster: beleuchtetes Elfenbein hinter Glas ── */
.fenster{position:relative;overflow:hidden;border-radius:3px;
  background:linear-gradient(180deg,#F4EFD6 0%,#E8E2C4 52%,#D8D2B4 100%);
  box-shadow:inset 0 0 0 4px #9A9A96,inset 0 4px 12px rgba(90,80,50,.28),
    0 5px 14px rgba(0,0,0,.35)}
.flab{position:absolute;font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(58,46,34,.55)}

/* ── Die Klaviertaste: gerippt, silbern, mit Druckpunkt ── */
.taste{position:relative;border-radius:3px;
  background:repeating-linear-gradient(90deg,#EDEDE9 0 2px,#B2B2AE 2px 4px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -2px 0 rgba(0,0,0,.28),
    0 4px 8px rgba(0,0,0,.34)}
.taste.unten{background:repeating-linear-gradient(90deg,#B2B2AE 0 2px,#8E8E8A 2px 4px);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.3)}
.tlab{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;letter-spacing:.14em;text-transform:uppercase;color:#26262A;
  text-align:center}
.taste.unten + .tlab{font-weight:700}
/* Die Klammer ist gedruckt: zwei Winkel und ein Wort dazwischen. */
.klammer{position:absolute;border-top:2px solid rgba(38,38,42,.62);
  border-left:2px solid rgba(38,38,42,.62);border-right:2px solid rgba(38,38,42,.62)}
.klab{position:absolute;left:50%;transform:translateX(-50%);font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;
  letter-spacing:.18em;text-transform:uppercase;color:rgba(38,38,42,.62);background:#C6C6C2;
  padding:0 8px}
.zeit{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:rgba(38,38,42,.62);font-variant-numeric:tabular-nums}

</style></head><body><div class="stage"><div style="position:absolute;inset:0;display:flex;flex-direction:column;
