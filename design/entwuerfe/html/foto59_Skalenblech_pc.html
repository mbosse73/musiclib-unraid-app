<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:1000px;overflow:hidden}
.stage{position:relative;width:1600px;height:1000px;overflow:hidden}

/* Die Frontplatte ist die Bühne, oben und unten von einer Chromleiste begrenzt */
.stage{background:linear-gradient(180deg,#eceae4 0%,#d3d0c8 100%);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#2f2e2b}
.geraet{position:absolute;inset:0;display:flex;flex-direction:column}

/* Chromleiste: drei Streifen, hell-dunkel-hell — mehr braucht es nicht */
.chrom{background:linear-gradient(180deg,#ffffff 0%,#c8c6c0 46%,
  #8e8b85 54%,#ffffff 100%)}

.klappe{position:relative;background:linear-gradient(180deg,#f6f5f1 0%,#eceae4 100%);
  border-radius:2px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.16),
             0 2px 3px rgba(0,0,0,.10)}
.sicht{background:#17181a;border-radius:2px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 8px rgba(0,0,0,.9)}
.wort{text-transform:uppercase;letter-spacing:.2em;color:rgba(47,46,43,.58)}

/* Die Skala: zwei Zahlenreihen, Teilstriche dazwischen, ein roter Strich quer */
.skala{position:relative;background:#fbfaf7;border-radius:2px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.skala .reihe{display:flex;justify-content:space-between;font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;
  color:#2f2e2b;font-variant-numeric:tabular-nums}
.skala .striche{display:flex;justify-content:space-between;align-items:center}
.skala .striche i{width:1px;background:rgba(47,46,43,.45)}
.skala .zeiger{position:absolute;top:0;bottom:0;width:2px;background:#cc2a22;
  box-shadow:0 0 5px rgba(204,42,34,.6)}

/* Kippschalter: Chromhülse mit schwarzem Hebel */
.kipp{display:flex;flex-direction:column;align-items:center;gap:6px}
.huelse{position:relative;border-radius:3px;
  background:linear-gradient(180deg,#ffffff 0%,#c8c6c0 50%,#8e8b85 100%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.huelse b{position:absolute;left:50%;transform:translateX(-50%);border-radius:999px;
  background:linear-gradient(180deg,#4a4a48 0%,#1b1b1a 100%)}

.taste{flex-shrink:0;display:flex;align-items:center;justify-content:center;
  border-radius:3px;
  background:linear-gradient(180deg,#fbfaf7 0%,#dedbd4 100%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.18),
             0 2px 3px rgba(0,0,0,.14)}
.zeiten{display:flex;justify-content:space-between;font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:rgba(47,46,43,.58);
  font-variant-numeric:tabular-nums}
.bib{display:inline-flex;align-items:center;border-radius:2px;
  background:linear-gradient(180deg,#fbfaf7 0%,#dedbd4 100%);color:#2f2e2b;
  text-transform:uppercase;font-weight:700;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
