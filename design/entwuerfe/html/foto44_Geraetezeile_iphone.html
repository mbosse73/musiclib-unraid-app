<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:2340px;overflow:hidden}
.stage{position:relative;width:1080px;height:2340px;overflow:hidden}

.stage{background:linear-gradient(105deg,#000 0%,#000 38%,#2a2a2c 62%,#0a0a0b 100%);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#f2f2f2}

.wort{text-transform:uppercase;color:rgba(242,242,242,.30);font-weight:600}

.zeiten{display:flex;justify-content:space-between;font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:rgba(242,242,242,.62);
  font-variant-numeric:tabular-nums}
