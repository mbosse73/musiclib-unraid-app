<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:1000px;overflow:hidden}
.stage{position:relative;width:1600px;height:1000px;overflow:hidden}

.stage{background:linear-gradient(170deg,#26282a 0%,#151617 58%,#0d0e0f 100%);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#eceeef}

/* Der Rand ist gedrehtes Metall, die Fläche darin ist stumpf */
.scheibe{position:relative;border-radius:50%;
  background:radial-gradient(circle at 42% 34%,#1e2022 0%,#141516 58%,#0c0d0e 100%);
  box-shadow:0 0 0 8px #2e3133,
             0 0 0 9px rgba(0,0,0,.6),
             0 20px 47px rgba(0,0,0,.62),
             inset 0 2px 2px rgba(255,255,255,.10)}
/* Nur der Kranz liegt über der Fläche — nicht jedes SVG darin */
.scheibe > svg{position:absolute;inset:0;display:block}
.mitte{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;align-items:center;gap:11px;white-space:nowrap}
.mitte .wort{color:rgba(236,238,239,.54);letter-spacing:.06em}

.taste{flex-shrink:0;border-radius:50%;display:flex;align-items:center;
  justify-content:center;background:#1c1e20;
  box-shadow:inset 0 0 0 1px rgba(236,238,239,.16)}
.taste.an{background:#1d3a22;box-shadow:inset 0 0 0 1px #5ce06a}
.zeiten{display:flex;justify-content:space-between;font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:rgba(236,238,239,.54);
  font-variant-numeric:tabular-nums}
.bib{display:inline-flex;align-items:center;border-radius:999px;
  border:1px solid rgba(236,238,239,.28);color:#eceeef;
  text-transform:uppercase;font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;letter-spacing:.14em}
