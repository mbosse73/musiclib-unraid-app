<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:2340px;overflow:hidden}
.stage{position:relative;width:1080px;height:2340px;overflow:hidden}

.stage{background:linear-gradient(150deg,#f4f4f2 0%,#dcdcda 50%,#ececeb 100%);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#2c2e30}

.geraet{position:relative;border-radius:22px;overflow:hidden;
  background:linear-gradient(180deg,#e9e9e7 0%,#cfcfcc 100%);
  box-shadow:0 26px 60px rgba(40,44,48,.28),
             inset 0 1px 0 rgba(255,255,255,.9)}

/* Die Glasfläche endet nicht mit einer Kante, sondern mit der Fortschrittslinie */
.glas{position:relative;background:#0d0e0f;color:#f4f5f4}
.glas .bahn{position:absolute;left:0;right:0;bottom:0;height:3px;
  background:rgba(244,245,244,.20)}
.glas .bahn i{position:absolute;left:0;top:0;bottom:0;background:#f4f5f4}
.marke{text-transform:uppercase;color:rgba(244,245,244,.52);letter-spacing:.2em;font-weight:500}
.zahl{font-weight:200;line-height:1;font-variant-numeric:tabular-nums;
  letter-spacing:-.03em}

/* Das Tastenfeld: Quadrate mit einer Fuge, kein Rahmen um das einzelne Feld */
.feld{display:grid;background:#cfcfcc}
.k{background:#fbfbfa;display:flex;align-items:center;justify-content:center;
  gap:10px;color:#7c8084;text-transform:uppercase;font-weight:600;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.k.gruen{color:#31b356}
.k.zeichen{font-size:0}
.zeiten{display:flex;justify-content:space-between;font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:rgba(244,245,244,.52);
  font-variant-numeric:tabular-nums}

</style></head><body><div class="stage"><div style="position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;padding:80px 56px">
  <div class="geraet" style="width:968px">
    <div class="glas" style="padding:78px 66px 62px">
  <div style="display:flex;align-items:flex-start;justify-content:space-between">
    <div>
      <div class="marke" style="font-size:24px">Spielt</div>
      <div class="marke" style="font-size:24px;margin-top:6px;
        color:rgba(244,245,244,.20)">Titel 03 von 04</div>
    </div>
    <div style="display:flex;gap:22px;align-items:center">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="rgba(244,245,244,.52)" stroke-width="2" stroke-linecap="round"><path d="M3 6h4l4 12h6M3 18h4l2-6"/><path d="M17 3l4 3-4 3M17 15l4 3-4 3"/></svg>
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="rgba(244,245,244,.20)" stroke-width="2" stroke-linecap="round"><path d="M4 9a5 5 0 0 1 5-5h9"/><path d="M15 1l3 3-3 3"/><path d="M20 15a5 5 0 0 1-5 5H6"/><path d="M9 23l-3-3 3-3"/></svg>
    </div>
  </div>

  <div class="zahl" style="font-size:216px;margin-top:18px">
    02:14</div>

  <div style="font-size:48px;margin-top:20px;
    font-weight:300">Blue in Green</div>
  <div style="font-size:32px;color:rgba(244,245,244,.52);margin-top:8px">
    Miles Davis · Kind of Blue · 1959</div>

  <div class="zeiten" style="font-size:28px;
    margin-top:18px">
    <span>02:14</span><span>05:37</span></div>

  <span class="bahn"><i style="width:40%"></i></span>
</div>
    <div class="feld" style="grid-template-columns:repeat(3,1fr);

  <div class="k gruen" style="height:176px;font-size:22px;

  <div class="k zeichen" style="height:176px"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#7c8084" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 L21 21"/></svg></div>

  <div class="k zeichen" style="height:176px"><svg width="46" height="46" viewBox="0 0 24 24"><path d="M7 5v14M20 5v14l-11-7z" stroke="#3a3d40" stroke-width="2" fill="#3a3d40" stroke-linejoin="round"/></svg></div>
  <div class="k zeichen" style="height:176px"><svg width="52" height="52" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" fill="#3a3d40"/><rect x="14" y="5" width="4" height="14" fill="#3a3d40"/></svg></div>
  <div class="k zeichen" style="height:176px"><svg width="46" height="46" viewBox="0 0 24 24"><path d="M17 5v14M4 5v14l11-7z" stroke="#3a3d40" stroke-width="2" fill="#3a3d40" stroke-linejoin="round"/></svg></div>

  <div class="k" style="height:176px;font-size:22px;
    letter-spacing:2.0px">Leiser</div>
  <div class="k" style="height:176px;font-size:22px;

  <div class="k" style="height:176px;font-size:22px;

</div>

</div></div></body></html>
