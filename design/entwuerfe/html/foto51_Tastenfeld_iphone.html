<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:2340px;overflow:hidden}
.stage{position:relative;width:1080px;height:2340px;overflow:hidden}

/* Das Gerät füllt die Bühne: oben Glas, unten Tasten, dazwischen nichts */
.stage{background:linear-gradient(180deg,#e9e9e7 0%,#cfcfcc 100%);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#2c2e30}
.geraet{position:absolute;inset:0;display:flex;flex-direction:column}

/* Die Glasfläche endet nicht mit einer Kante, sondern mit der Fortschrittslinie */
.glas{position:relative;background:#0d0e0f;color:#f4f5f4}
.glas .bahn{position:absolute;left:0;right:0;bottom:0;height:3px;
  background:rgba(244,245,244,.20)}
.glas .bahn i{position:absolute;left:0;top:0;bottom:0;background:#f4f5f4}
.marke{text-transform:uppercase;color:rgba(244,245,244,.52);letter-spacing:.2em;font-weight:500}
.zahl{font-weight:200;line-height:1;font-variant-numeric:tabular-nums;
  letter-spacing:-.03em}

/* Das Tastenfeld: Quadrate mit einer Fuge, kein Rahmen um das einzelne Feld */
.feld{display:grid;background:#cfcfcc}
.k{background:#fbfbfa;display:flex;align-items:center;justify-content:center;
  gap:10px;color:#7c8084;text-transform:uppercase;font-weight:600;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.k.gruen{color:#31b356}
.k.zeichen{font-size:0}
.zeiten{display:flex;justify-content:space-between;font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:rgba(244,245,244,.52);
  font-variant-numeric:tabular-nums}

</style></head><body><div class="stage"><div class="geraet">

    <div>
      <div class="marke" style="font-size:26px">Spielt</div>
      <div class="marke" style="font-size:26px;margin-top:6px;
        color:rgba(244,245,244,.20)">Titel 03 von 04</div>
    </div>

      <svg width="51" height="51" viewBox="0 0 24 24" fill="none" stroke="rgba(244,245,244,.20)" stroke-width="2" stroke-linecap="round"><path d="M4 9a5 5 0 0 1 5-5h9"/><path d="M15 1l3 3-3 3"/><path d="M20 15a5 5 0 0 1-5 5H6"/><path d="M9 23l-3-3 3-3"/></svg>

</div>

  <div class="k zeichen" style="height:214px"><svg width="50" height="50" viewBox="0 0 24 24"><path d="M17 5v14M4 5v14l11-7z" stroke="#3a3d40" stroke-width="2" fill="#3a3d40" stroke-linejoin="round"/></svg></div>

  <div class="k" style="height:214px;font-size:24px;

</div>
</div></div></body></html>
