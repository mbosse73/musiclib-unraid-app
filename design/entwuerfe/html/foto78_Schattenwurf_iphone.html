*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:2340px;overflow:hidden}
.stage{position:relative;width:1080px;height:2340px;overflow:hidden}

.stage{background:

/* Kalk ist nicht glatt. Das Korn ist ein Muster, kein Bild — sonst waere es

.stage::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;

.wer{font-family:Georgia,'Times New Roman',ui-serif,serif;font-style:italic;font-size:36px;

.uhr{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;font-size:30px;color:#4A4335;

/* Ein Messingstift sitzt in der Platte: Loch, Rand, Kuppe. */
