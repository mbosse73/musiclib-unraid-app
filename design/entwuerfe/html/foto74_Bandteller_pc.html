<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:1000px;overflow:hidden}
.stage{position:relative;width:1600px;height:1000px;overflow:hidden}

.stage{background:linear-gradient(180deg,#232527 0%,#17181A 55%,#0E0F11 100%);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#E9EBEC;-webkit-font-smoothing:antialiased}
.kap{letter-spacing:.24em;text-transform:uppercase;color:rgba(233,235,236,.34);font-weight:500}

/* ── Die Frontplatte: gebürstetes Aluminium über dunklem Feld ── */
.front{position:relative;background:linear-gradient(180deg,#4A4D51 0%,#3E4145 60%,#303336 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.6),
    0 10px 26px rgba(0,0,0,.55)}
.leiste{background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 1px,rgba(0,0,0,.05) 1px 3px),
    linear-gradient(180deg,#D6D8DA 0%,#C4C6C8 46%,#A2A4A6 100%);
  color:#1A1C1E;box-shadow:inset 0 1px 0 rgba(255,255,255,.85)}

/* ── Die Wipptaste: schwarzer Hebel in einer Nut, gekippt heisst „steht" ── */
.wippe{position:relative;border-radius:2px;
  background:linear-gradient(180deg,#2A2C2F 0%,#0E1012 62%,#212326 100%);
  box-shadow:0 3px 7px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.16)}
.wippe.an{background:linear-gradient(180deg,#0E1012 0%,#2A2C2F 62%,#3A3D40 100%);
  box-shadow:inset 0 3px 6px rgba(0,0,0,.7)}
.wippe.rot{background:linear-gradient(180deg,#E0483C 0%,#C42B22 60%,#8E1E17 100%)}
.wlab{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(233,235,236,.34);
  text-align:center}
.wippe.an + .wlab{color:#E9EBEC;font-weight:700}

/* ── Das Instrument: cremefarbenes Blatt in rotem Rahmen ── */
.werk{position:relative;overflow:hidden;
  background:linear-gradient(180deg,#F2EEE2 0%,#DAD5C6 100%);
  box-shadow:inset 0 0 0 3px #C42B22,0 1px 0 rgba(255,255,255,.2)}

/* ── Das Zählwerk: vier Walzen hinter einem Fenster ── */
.zaehler{display:flex;gap:2px;background:#1A1C1E;padding:4px;
  border-radius:2px;box-shadow:inset 0 2px 6px rgba(0,0,0,.8)}
.zaehler span{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;font-weight:700;color:#EDE9DC;
  background:linear-gradient(180deg,#3C3E41,#191B1D 52%,#2E3033);
  padding:3px 7px;border-radius:1px;font-variant-numeric:tabular-nums}

.regler{border-radius:50%;position:relative;
  background:radial-gradient(circle at 34% 28%,#F2F4F5,#9EA0A2 78%);
  box-shadow:inset 0 0 0 2px #D8DADC,0 3px 8px rgba(0,0,0,.5)}
.regler::after{content:'';position:absolute;left:50%;top:5px;width:2px;
  height:36%;transform:translateX(-50%);background:#1A1C1E;border-radius:1px}
.zeit{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:rgba(233,235,236,.34);font-variant-numeric:tabular-nums}
.titel{font-weight:300;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
