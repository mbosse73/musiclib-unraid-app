<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:2340px;overflow:hidden}
.stage{position:relative;width:1080px;height:2340px;overflow:hidden}

.stage{background:linear-gradient(155deg,#c7c9cb 0%,#9fa2a5 46%,#bcbfc2 100%);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#f0f1f2}

.modul{position:relative;border-radius:26px;
  background:linear-gradient(168deg,#34373a 0%,#212325 26%,#141618 100%);
  box-shadow:0 28px 62px rgba(20,22,24,.5),
             inset 0 2px 0 rgba(255,255,255,.16)}

/* Das Fenster liegt tiefer als das Gehäuse */
.fenster{background:#0a0b0c;border-radius:14px;
  box-shadow:inset 0 3px 12px rgba(0,0,0,.9),
             0 0 0 1px rgba(255,255,255,.06)}

.zeile{display:flex;justify-content:space-between;font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;
  color:rgba(240,241,242,.55);text-transform:uppercase;letter-spacing:.1em}
.zahl{font-weight:200;line-height:1;text-align:center;
  font-variant-numeric:tabular-nums;letter-spacing:.02em}
.wort{text-align:center;color:rgba(240,241,242,.55);font-weight:400}

/* Geriffelter Knopf: Zylinder mit Rillen, wie im Foto oben */
.knopf{position:relative;border-radius:999px;flex-shrink:0;overflow:hidden;
  background:linear-gradient(180deg,#4b4f53 0%,#25282b 52%,#101214 100%);
  box-shadow:0 6px 14px rgba(0,0,0,.5)}
.knopf::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 2px,
    rgba(0,0,0,.30) 2px 5px)}
.knopf span{position:absolute;left:0;right:0;bottom:6px;z-index:1;
  text-align:center;font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:#f0f1f2}

/* Gummitasten: matt, mit einem Lichtsaum an der Oberkante */
.taste{flex-shrink:0;border-radius:50%;display:flex;align-items:center;
  justify-content:center;
  background:linear-gradient(180deg,#3c4044 0%,#1b1e20 60%,#111315 100%);
  box-shadow:0 5px 12px rgba(0,0,0,.5),
             inset 0 2px 0 rgba(255,255,255,.22)}
.taste.warm{background:linear-gradient(180deg,#ff8b3a 0%,#f26a12 60%,#b8450a 100%)}
.bib{display:inline-flex;align-items:center;color:rgba(240,241,242,.55);font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;
  text-transform:uppercase}

</style></head><body><div class="stage"><div style="position:absolute;inset:0;display:flex;align-items:center;
