<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:2340px;overflow:hidden}
.stage{position:relative;width:1080px;height:2340px;overflow:hidden}

.stage{background:#8f8b84;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#141416}
.haufen{position:absolute;inset:0;overflow:hidden}
.haufen > div{position:absolute;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45))}

/* Der Haufen wird nach unten hin abgedunkelt, damit die Leiste lesbar bleibt */
.schleier{position:absolute;left:0;right:0;bottom:0;pointer-events:none;
  background:linear-gradient(180deg, rgba(10,10,12,0) 0%, rgba(10,10,12,.62) 55%,
    rgba(10,10,12,.86) 100%)}

.pille{display:inline-flex;align-items:center;border-radius:999px;
  background:rgba(18,18,20,.72);color:#f7f6f3;backdrop-filter:blur(14px);
  box-shadow:0 8px 20px rgba(0,0,0,.4)}
.knopfrot{display:inline-flex;align-items:center;justify-content:center;
  background:#e0342c;color:#fff;font-weight:700;
  box-shadow:0 10px 24px rgba(180,35,28,.5)}

.leiste{position:relative;background:rgba(18,18,20,.62);
  border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(22px);
  color:#f7f6f3}
.balken{position:relative;border-radius:999px;background:rgba(255,255,255,.26)}
.balken i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:#f7f6f3}
.balken b{position:absolute;top:50%;transform:translate(-50%,-50%);border-radius:50%;
  background:#f7f6f3}
.zeiten{display:flex;justify-content:space-between;font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;
  color:rgba(247,246,243,.66);font-variant-numeric:tabular-nums}
.taste{flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22)}
.taste.gross{background:#f7f6f3;border-color:transparent}
