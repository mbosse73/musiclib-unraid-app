<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:2340px;overflow:hidden}
.stage{position:relative;width:1080px;height:2340px;overflow:hidden}

.stage{background:linear-gradient(180deg,#EFEADA 0%,#DED8C6 100%);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#33291C;-webkit-font-smoothing:antialiased}
.kap{letter-spacing:.24em;text-transform:uppercase;color:rgba(51,41,28,.40);font-weight:500}
.bib{display:inline-flex;align-items:center;color:rgba(51,41,28,.62);letter-spacing:.22em;
  text-transform:uppercase;font-weight:500}

/* ── Die Front: gebürstetes Champagnerblech mit Holzwangen ── */
.front{position:relative;background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 1px,rgba(0,0,0,.05) 1px 3px),
    linear-gradient(180deg,#EDE7D6 0%,#D8D2C0 40%,#B9B29C 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -1px 0 rgba(0,0,0,.22),
    0 13px 32px rgba(60,45,25,.28)}
.wange{position:absolute;top:0;bottom:0;width:24px;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.16) 0 2px,rgba(255,255,255,.05) 2px 7px),
    linear-gradient(90deg,#6B462A,#5A3A22);
  box-shadow:inset 0 0 8px rgba(0,0,0,.5)}

/* ── Das Fenster: dunkles Glas in einer Fassung ── */
.fenster{position:relative;overflow:hidden;border-radius:3px;
  background:linear-gradient(180deg,#2A2721 0%,#1C1A16 40%,#141310 100%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),inset 0 8px 17px rgba(0,0,0,.6),
    0 1px 0 rgba(255,255,255,.6)}
.tick{position:absolute;background:rgba(239,233,214,.45);transform:translateX(-50%)}
.tick.gross{background:#EFE9D6}
.zahl{position:absolute;font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:#EFE9D6;transform:translateX(-50%);
  font-variant-numeric:tabular-nums}
.marke{position:absolute;transform:translateX(-50%);background:#B4341E;border-radius:1px;
  box-shadow:0 0 9px rgba(180,52,30,.8)}
.flab{position:absolute;font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(239,233,214,.52)}

/* ── Das Zeigerwerk: cremefarbenes Blatt, ein Zeiger, kein roter Bogen ──
   Es zeigt die Position im Titel — das ist die Anzeige, die das Rad nicht
   geben kann. */
.werk{position:relative;border-radius:3px;overflow:hidden;
  background:linear-gradient(180deg,#F6F1DE 0%,#EFE9D6 62%,#DED7C0 100%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),inset 0 5px 11px rgba(90,70,40,.22)}

/* ── Das Rad: gerippt, rund, mit Tiefe. Die Rippen sind gezeichnet. ── */
.rad{position:relative;border-radius:50%;background:
    repeating-conic-gradient(from 0deg,#3A342A 0deg 3deg,#15120E 3deg 6deg),
    radial-gradient(circle at 36% 30%,#4A4238,#0E0C0A 72%);
  box-shadow:inset 0 0 0 5px #241F18,
    inset 0 6px 15px rgba(0,0,0,.8),
    0 8px 19px rgba(60,45,25,.45)}
.rad::after{content:'';position:absolute;inset:21%;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#6B6255,#221E18);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.radlab{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;letter-spacing:.18em;text-transform:uppercase;color:rgba(51,41,28,.40);
  text-align:center}

/* ── Drehknöpfe der unteren Reihe ── */
.dreh{position:relative;border-radius:50%;background:
    radial-gradient(circle at 34% 28%,#FFFDF4,#B7B09A 78%);
  box-shadow:inset 0 0 0 2px #E4DECB,0 3px 8px rgba(60,45,25,.4)}
.dreh::after{content:'';position:absolute;left:50%;top:6px;width:2px;
  height:38%;transform:translateX(-50%);background:#33291C;border-radius:1px}
.dlab{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(51,41,28,.40);
  text-align:center}
.zeit{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:rgba(51,41,28,.62);font-variant-numeric:tabular-nums}
