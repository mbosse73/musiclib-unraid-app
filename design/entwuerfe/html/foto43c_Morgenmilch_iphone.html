<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:2340px;overflow:hidden}
.stage{position:relative;width:1080px;height:2340px;overflow:hidden}

.stage{background:linear-gradient(180deg, #eef3f4 0%, #dbe6e8 30%, #c3d3d6 52%, #a9bcc0 72%, #8fa4a8 100%);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#1e2a2c}

/* Der Horizont: eine dunkle Kante mit weichem Ansatz, kein Foto */
.horizont{position:absolute;left:0;right:0;background:#7b9095}
.huegel{position:absolute;border-radius:50%;background:#8ca1a5}

/* Glasdicke: Weichzeichnung, Eigenfarbe, Randhelligkeit und Innenglanz
   wachsen gemeinsam — dünnes Glas ist fast nur eine Tönung. */
.glas{position:relative;background:rgba(255,255,255,0.46);
  border:1px solid rgba(255,255,255,0.72);
  border-top-color:rgba(255,255,255,0.86);
  backdrop-filter:blur(86px) saturate(1.0);
  -webkit-backdrop-filter:blur(86px) saturate(1.0);
  box-shadow:0 26px 60px rgba(0,0,0,.38),
    inset 0 1px 0 rgba(255,255,255,0.86)}
.glas::after{content:"";position:absolute;left:0;right:0;top:0;height:38%;
  border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg, rgba(255,255,255,0.3) 0%,
    rgba(255,255,255,0) 100%)}

.linie{position:relative;border-radius:999px;background:#1e2a2c59}
.linie i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:#1e2a2c}
.linie b{position:absolute;top:50%;transform:translate(-50%,-50%);border-radius:50%;
  background:#1e2a2c;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.zeiten{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;
  font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace}
.tasten{display:flex;align-items:center;justify-content:space-between}
.bib{display:inline-flex;align-items:center;border-radius:999px;
  background:rgba(255,255,255,0.50);border:1px solid rgba(255,255,255,0.72);
  backdrop-filter:blur(60px);text-transform:uppercase}
.marke{letter-spacing:4.0px;text-transform:uppercase;color:rgba(30,42,44,.62)}

</style></head><body><div class="stage"><div class="horizont" style="top:1520px;bottom:0"></div>
<div class="huegel" style="left:-260px;top:1360px;width:1000px;height:420px"></div>
<div class="huegel" style="right:-200px;top:1430px;width:820px;height:360px"></div>
<div style="position:absolute;inset:0;padding:150px 62px 130px;display:flex;
  flex-direction:column;align-items:center">
  <span class="bib" style="height:68px;padding:0 26px;gap:14px;font-size:21px;letter-spacing:3.4px"><svg width="27" height="27" viewBox="0 0 24 24"><rect x="3" y="4" width="3" height="16" rx="1" fill="#1e2a2c"/><rect x="8" y="4" width="3" height="16" rx="1" fill="#1e2a2c"/><path d="M14.5 5.4 L18.2 4.5 L21.5 19 L17.8 19.9 Z" fill="#1e2a2c"/></svg>Sammlung · 240</span>
  <div style="margin-top:auto;margin-bottom:auto;width:100%;display:flex;justify-content:center">
    <div class="glas" style="width:956px;border-radius:52px;
  padding:38px 40px 34px">
  <div style="display:flex;align-items:center;gap:30px">
    <div style="line-height:0;flex-shrink:0"><svg viewBox="0 0 220 220" width="220" height="220">
<defs><linearGradient id="hg220dfe" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#dfeaec"/><stop offset="52%" stop-color="#b9cbcf"/>
<stop offset="100%" stop-color="#8ba1a6"/></linearGradient></defs>
<rect x="0" y="0" width="220" height="220" rx="48.4" fill="url(#hg220dfe)"/>
<circle cx="110.0" cy="136.4" r="18.7" fill="#ffffff"/>
<path d="M0 154.0 Q 66.0 127.6 121.0 149.6
  T 220 138.6 L220 220 L0 220 Z" fill="#61787d"/>
</svg></div>
    <div style="flex:1;min-width:0">
      <div style="font-size:54px;font-weight:700;overflow:hidden;
        white-space:nowrap;text-overflow:ellipsis">Blue in Green</div>

    </div>
  </div>
  <div class="zeiten" style="font-size:26px;margin-top:40px">
    <span>02:14</span><span>-03:23</span></div>
  <div class="linie" style="height:7px;margin-top:16px">
    <i style="width:40%"></i>
    <b style="left:40%;width:22px;height:22px"></b></div>
  <div style="margin-top:36px"><div class="tasten" style="gap:10px"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#c2662a" stroke-width="2.6" stroke-linecap="round"><path d="M3 6h4l4 12h6M3 18h4l2-6"/><path d="M17 3l4 3-4 3M17 15l4 3-4 3"/></svg><svg width="46" height="46" viewBox="0 0 24 24"><path d="M7 5v14M20 5v14l-11-7z" stroke="#1e2a2c" stroke-width="2" fill="#1e2a2c" stroke-linejoin="round"/></svg><svg width="48" height="48" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" fill="#1e2a2c"/><rect x="14" y="5" width="4" height="14" fill="#1e2a2c"/></svg><svg width="46" height="46" viewBox="0 0 24 24"><path d="M17 5v14M4 5v14l11-7z" stroke="#1e2a2c" stroke-width="2" fill="#1e2a2c" stroke-linejoin="round"/></svg><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#1e2a2c" stroke-width="2.4" stroke-linecap="round"><path d="M4 9a5 5 0 0 1 5-5h9"/><path d="M15 1l3 3-3 3"/><path d="M20 15a5 5 0 0 1-5 5H6"/><path d="M9 23l-3-3 3-3"/></svg></div></div>
</div>
  </div>
  <div class="marke" style="font-size:20px">Blasser Morgen, sehr dickes Glas, dunkle Schrift</div>
</div></div></body></html>
