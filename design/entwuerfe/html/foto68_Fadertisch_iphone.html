<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:2340px;overflow:hidden}
.stage{position:relative;width:1080px;height:2340px;overflow:hidden}

.stage{background:linear-gradient(160deg,#4A4E52 0%,#3A3D40 40%,#2A2D30 100%);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#E8E9EA;-webkit-font-smoothing:antialiased}
.kap{letter-spacing:.24em;text-transform:uppercase;color:rgba(232,233,234,.34);font-weight:500}

/* ── Der Bildschirm: eine schwarze Scheibe, bündig eingelassen ── */
.schirm{position:relative;background:#141618;border-radius:4px;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),inset 0 6px 18px rgba(0,0,0,.6),
    0 1px 0 rgba(255,255,255,.10)}
.bahn{position:relative;height:6px;border-radius:3px;
  background:rgba(255,255,255,.12);overflow:hidden}
.bahn i{position:absolute;left:0;top:0;bottom:0;background:#F97316;border-radius:inherit}

/* ── Pads: Rechtecke mit weicher Kante, gedrückt heisst leuchtet ── */
.pads{display:grid;gap:10px}
.pad{position:relative;border-radius:5px;background:linear-gradient(180deg,#4E5256,#42464A);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 3px 7px rgba(0,0,0,.35);
  display:flex;align-items:flex-end;padding:9px;overflow:hidden}
.pad span{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;letter-spacing:.04em;color:rgba(232,233,234,.60);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;width:100%}
.pad.an{background:linear-gradient(180deg,#FFA657,#F97316);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 18px rgba(249,115,22,.45)}
.pad.an span{color:rgba(28,16,4,.86);font-weight:700}
.pad.gespielt{background:linear-gradient(180deg,#3A3E42,#2E3236)}
.pad.gespielt span{color:rgba(232,233,234,.34)}

/* ── Fader: eine Nut, ein Knopf. Der Knopf ist schwarz und rund oben. ── */
.fader{display:flex;flex-direction:column;align-items:center;gap:9px}
.nut{position:relative;width:8px;border-radius:4px;
  background:linear-gradient(90deg,#232629,#171A1C);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.5),inset 0 2px 5px rgba(0,0,0,.7)}
.griff{position:absolute;left:50%;transform:translate(-50%,-50%);border-radius:5px;
  background:linear-gradient(180deg,#3D4145 0%,#15171A 60%,#2A2D30 100%);
  box-shadow:0 3px 7px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.22)}
.flab{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;font-size:13px;letter-spacing:.12em;color:rgba(232,233,234,.34)}

/* ── Die drei Transporttasten: gross, flach, zwei weiss, eine orange ── */
.tk{display:flex;align-items:center;justify-content:center;border-radius:6px;
  box-shadow:0 4px 10px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.3)}
.tk.hell{background:linear-gradient(180deg,#FFFFFF,#DCDCD8)}
.tk.orange{background:linear-gradient(180deg,#FFA657,#F97316)}
/* Zwei Drehregler — das einzige Runde auf der ganzen Fläche. */
.rund{border-radius:50%;position:relative}
.rund.weiss{background:radial-gradient(circle at 36% 30%,#FFFFFF,#C9C9C4);
  box-shadow:0 4px 9px rgba(0,0,0,.4)}
.rund.schwarz{background:radial-gradient(circle at 36% 30%,#3A3E42,#0E1012);
  box-shadow:0 4px 9px rgba(0,0,0,.5)}
.titel{font-weight:300;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.zeit{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:rgba(232,233,234,.34);font-variant-numeric:tabular-nums}
