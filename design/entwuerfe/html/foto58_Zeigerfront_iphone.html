<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:2340px;overflow:hidden}
.stage{position:relative;width:1080px;height:2340px;overflow:hidden}

/* Die Front füllt die Bühne — man steht davor, nicht im Zimmer daneben */
.stage{background:linear-gradient(180deg,#121315 0%,#0a0b0c 100%);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#eef0f2}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10)}
.front{position:absolute;inset:0;display:flex}
.anzeige{background:#0a0b0c;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}

/* Die Tasten: hochkant eine Spalte neben der Anzeige, quer eine Zeile
   darunter — dieselben sechs Zeichen, dieselben Fugen, nur gedreht. */
.spalte{display:flex;flex-direction:column;justify-content:space-between;
  align-items:center}
.spalte i{display:flex;align-items:center;justify-content:center;width:100%;
  border-bottom:1px solid rgba(238,240,242,.10)}
.spalte i:last-child{border-bottom:0}
.reihe{display:flex;align-items:stretch}
.reihe i{flex:1;display:flex;align-items:center;justify-content:center;
  border-right:1px solid rgba(238,240,242,.10)}
.reihe i:last-child{border-right:0}

/* Der Ring: gedrehtes Aluminium, innen dunkel */
.ring{position:relative;border-radius:50%;flex-shrink:0;
  background:conic-gradient(#c8ccd0 0deg,#f4f5f6 60deg,#6e7377 140deg,
    #f4f5f6 220deg,#6e7377 300deg,#c8ccd0 360deg)}
.ring span{position:absolute;border-radius:50%;background:#121315;
  box-shadow:inset 0 0 14px rgba(0,0,0,.8)}

.bahn{position:relative;background:rgba(238,240,242,.16)}
.bahn i{position:absolute;left:0;top:0;bottom:0;background:#4fb3e8}
.zeiten{display:flex;justify-content:space-between;font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;color:rgba(238,240,242,.56);
  font-variant-numeric:tabular-nums}
.bib{display:inline-flex;align-items:center;color:rgba(238,240,242,.56);font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;
  text-transform:uppercase}
.marke{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(238,240,242,.22)}
