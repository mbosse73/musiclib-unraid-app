<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:1000px;overflow:hidden}
.stage{position:relative;width:1600px;height:1000px;overflow:hidden}

.stage{background:linear-gradient(150deg,#2a2422 0%,#171313 55%,#241d1b 100%);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#241a16}

/* Gebürstetes Blech: ein Verlauf plus feine Striche in Laufrichtung */
.platte{position:relative;overflow:hidden;border-radius:27px;
  background:linear-gradient(158deg,#e6c6ba 0%,#d3ac9f 42%,#b98c7c 100%);
  box-shadow:0 23px 55px rgba(0,0,0,.55),
             inset 0 2px 0 rgba(255,255,255,.75),
             inset 0 -2px 0 rgba(0,0,0,.18)}
.platte::before{content:"";position:absolute;inset:0;opacity:.28;pointer-events:none;
  background:repeating-linear-gradient(112deg,rgba(255,255,255,.5) 0 1px,
    rgba(0,0,0,.05) 1px 3px)}

/* Schiene: links gefüllt, rechts dunkel — wie der Schieber im Foto */
.schiene{position:relative;display:flex;align-items:center}
.schiene .bahn{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  border-radius:999px;background:#3b3330}
.schiene .bahn i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;
  background:#b8352c}
.griff{position:relative;border-radius:50%;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;
  background:radial-gradient(circle at 34% 26%,#fbfaf9 0%,#d6d2ce 48%,#a19c97 100%);
  box-shadow:0 3px 7px rgba(0,0,0,.35),
             0 0 0 2px rgba(255,255,255,.55)}

.zeile{font-weight:800;letter-spacing:-.02em;text-align:center}
.dauer{font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;font-weight:700;text-align:center;
  font-variant-numeric:tabular-nums}

/* Die Tasten sind Metallzylinder: heller Ring, gewölbte Fläche, harter Schatten */
.taste{position:relative;flex-shrink:0;border-radius:50%;display:flex;
  align-items:center;justify-content:center;
  background:radial-gradient(circle at 36% 26%,#fbfaf9 0%,#d6d2ce 52%,#a19c97 100%);
  box-shadow:0 6px 12px rgba(0,0,0,.38),
             0 0 0 4px rgba(255,255,255,.42),
             inset 0 -2px 5px rgba(0,0,0,.22)}
.taste.rot{background:radial-gradient(circle at 36% 26%,#e0574c 0%,#b8352c 54%,#7e2119 100%);
  box-shadow:0 6px 12px rgba(0,0,0,.42),
             0 0 0 4px rgba(255,255,255,.32),
             inset 0 -2px 5px rgba(0,0,0,.3)}

</style></head><body><div class="stage"><div style="position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;padding:60px 78px">
  <div class="platte" style="width:1444px;padding:52px 60px;display:flex;gap:60px;
    align-items:center">
    <div style="flex:1;min-width:0;position:relative">
      <div class="schiene" style="height:58px"><span class="bahn" style="height:8px"><i style="width:48%"></i></span><span class="griff" style="width:58px;height:58px;margin-left:calc(48% - 29px)"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#3a3330" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="#3a3330"/><path d="M17 9.5a4 4 0 0 1 0 5"/><path d="M19.5 7a7.5 7.5 0 0 1 0 10"/></svg></span></div>
      <div class="zeile" style="font-size:44px;margin-top:38px">
        Miles Davis / Blue in Green</div>
      <div class="zeile" style="font-size:22px;color:rgba(36,26,22,.62);font-weight:500;
        margin-top:10px">Kind of Blue · 1959</div>
      <div style="margin-top:40px"><div style="display:flex;align-items:center;justify-content:center;gap:26px"><div class="taste" style="width:112px;height:112px"><svg width="44" height="44" viewBox="0 0 24 24"><path d="M7 5v14M20 5v14l-11-7z" stroke="#3a3330" stroke-width="2" fill="#3a3330" stroke-linejoin="round"/></svg></div><div class="taste rot" style="width:132px;height:132px"><svg width="50" height="50" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" fill="#fdeae7"/><rect x="14" y="5" width="4" height="14" fill="#fdeae7"/></svg></div><div class="taste" style="width:112px;height:112px"><svg width="44" height="44" viewBox="0 0 24 24"><path d="M17 5v14M4 5v14l11-7z" stroke="#3a3330" stroke-width="2" fill="#3a3330" stroke-linejoin="round"/></svg></div><div class="taste" style="width:112px;height:112px"><svg width="47" height="47" viewBox="0 0 24 24"><rect x="3" y="4" width="3" height="16" rx="1" fill="#3a3330"/><rect x="8" y="4" width="3" height="16" rx="1" fill="#3a3330"/><path d="M14.5 5.4 L18.2 4.5 L21.5 19 L17.8 19.9 Z" fill="#3a3330"/></svg></div></div></div>
      <div class="dauer" style="font-size:25px;margin-top:38px">
        Dauer: 02:14 / 05:37</div>
      <div style="margin-top:22px"><div class="schiene" style="height:36px"><span class="bahn" style="height:7px"><i style="width:40%"></i></span><span class="griff" style="width:36px;height:36px;margin-left:calc(40% - 18px)"></span></div></div>
    </div>

    <div style="width:470px;flex-shrink:0;position:relative">
      <div style="font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;font-size:16px;letter-spacing:.18em;
        text-transform:uppercase;color:rgba(36,26,22,.62)">Sammlung · 240</div>
      <div style="font-size:30px;font-weight:800;margin-top:12px;letter-spacing:-.02em">
        Kind of Blue</div>
      <div style="margin-top:20px"><div style="display:flex;align-items:baseline;gap:14px;padding:9px 0;border-top:1px solid rgba(36,26,22,.22);font-size:21px;color:rgba(36,26,22,.62)"><span style="font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;font-size:17px;color:rgba(36,26,22,.62)">01</span><span style="flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">So What</span><span style="font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;font-size:17px;color:rgba(36,26,22,.62)">9:22</span></div><div style="display:flex;align-items:baseline;gap:14px;padding:9px 0;border-top:1px solid rgba(36,26,22,.22);font-size:21px;color:rgba(36,26,22,.62)"><span style="font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;font-size:17px;color:rgba(36,26,22,.62)">02</span><span style="flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">Freddie Freeloader</span><span style="font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;font-size:17px;color:rgba(36,26,22,.62)">9:46</span></div><div style="display:flex;align-items:baseline;gap:14px;padding:9px 0;border-top:1px solid rgba(36,26,22,.22);font-size:21px;font-weight:800"><span style="font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;font-size:17px;color:rgba(36,26,22,.62)">03</span><span style="flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">Blue in Green</span><span style="font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;font-size:17px;color:rgba(36,26,22,.62)">5:37</span></div><div style="display:flex;align-items:baseline;gap:14px;padding:9px 0;border-top:1px solid rgba(36,26,22,.22);font-size:21px;color:rgba(36,26,22,.62)"><span style="font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;font-size:17px;color:rgba(36,26,22,.62)">04</span><span style="flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">All Blues</span><span style="font-family:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;font-size:17px;color:rgba(36,26,22,.62)">11:33</span></div>
        <div style="border-top:1px solid rgba(36,26,22,.22)"></div></div>
    </div>
  </div>
</div></div></body></html>
